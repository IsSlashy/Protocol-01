[workspace]
members = [
    "programs/zk_shielded",
    "programs/specter",
    "programs/stream",
    "programs/subscription",
    "programs/whitelist",
    "programs/p01-fee-splitter",
    "programs/p01_zkspl",
    "programs/p01_trustless",
    "programs/p01_relayer",
]

resolver = "2"

[workspace.package]
rust-version = "1.84"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# =============================================================================
# WORKSPACE DEPENDENCIES
# =============================================================================

[workspace.dependencies]
# Anchor dependencies - 0.32.1 (compatible with Solana v2 / Agave)
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

# Serialization - borsh version compatible with Anchor 0.32.1
borsh = "1.5"

# Common utilities
thiserror = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }

# ZK dependencies for shielded transactions
ark-bn254 = "0.4.0"
ark-groth16 = "0.4.0"
ark-serialize = "0.4.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-std = "0.4.0"
sha3 = "0.10"

# Pin blake3 to avoid edition2024 (Solana platform-tools cargo is 1.84)
blake3 = "=1.8.2"
