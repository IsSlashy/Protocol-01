<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360, height=600, initial-scale=1.0" />
    <title>Protocol 01</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 360px;
        height: 600px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #070709;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #eae7df;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      /* Initial loading state before React mounts */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The boot mark, drawn inline. Was the 01 raster, which had to be
         fetched before the first frame could show anything at all. */
      #root:empty::before {
        content: '';
        width: 44px;
        height: 44px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%2339c5bb' stroke-width='1.25'><circle cx='16' cy='16' r='13' opacity='.55'/><path d='M16 3V29'/><path d='M9.5 12.5H22.5' opacity='.35'/><path d='M9.5 19.5H22.5' opacity='.35'/></svg>");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before { animation: none; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Buffer polyfill MUST run before any module code -->
    <script src="/polyfills.js"></script>
    <script type="module" src="/src/popup/main.tsx"></script>
  </body>
</html>
