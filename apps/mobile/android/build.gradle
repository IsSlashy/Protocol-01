// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// NDK 27.2 — NDK 28 clang 19 crashes with -O2 on expo-modules-core (release build)
// worklets/reanimated compile fine from source with 27.2's libc++
rootProject.ext.ndkVersion = "27.2.12479018"

// Force consistent JVM target across all subprojects (Java 17)
subprojects { sub ->
  sub.plugins.whenPluginAdded { plugin ->
    if (plugin.class.name.contains('kotlin') || plugin.class.name.contains('android')) {
      sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
          jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
      }
    }
  }
}
