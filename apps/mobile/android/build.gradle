// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// NDK 28 — required for react-native-worklets 0.8.1 (C++20 uses __cxa_init_primary_exception
// which only exists in NDK 28's libc++_shared.so). The .so is bundled in the APK so this
// works on all Android versions, not just Android 15+.
rootProject.ext.ndkVersion = "28.0.13004108"

// Force consistent JVM target across all subprojects (Java 17)
subprojects { sub ->
  sub.plugins.whenPluginAdded { plugin ->
    if (plugin.class.name.contains('kotlin') || plugin.class.name.contains('android')) {
      sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
          jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
      }
    }
  }
}
