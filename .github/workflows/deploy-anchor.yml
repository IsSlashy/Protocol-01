name: Build and Deploy Anchor Program

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'devnet'
        type: choice
        options:
          - devnet
          - mainnet-beta

env:
  SOLANA_VERSION: '1.18.17'
  ANCHOR_VERSION: '0.30.1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        # Was `dtolnay/rust-action@stable`: no such repository exists under
        # that name (dtolnay publishes rust-toolchain), so whoever registered
        # it would have run beside SOLANA_KEYPAIR. Checked by
        # scripts/ci/workflow-pins.test.mjs.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the commit the stable branch pointed at on 2026-09-23
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Setup Solana Keypair
        run: |
          echo "${{ secrets.SOLANA_KEYPAIR }}" > ~/.config/solana/id.json
          solana config set --url ${{ inputs.network }}
          solana config set --keypair ~/.config/solana/id.json

      - name: Build Anchor Program
        run: |
          cd programs/stream
          anchor build

      - name: Deploy to ${{ inputs.network }}
        run: |
          cd programs/stream
          anchor deploy --provider.cluster ${{ inputs.network }}

      - name: Output Program ID
        run: |
          echo "Program deployed!"
          solana program show --programs
