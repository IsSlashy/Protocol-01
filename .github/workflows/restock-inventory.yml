# The tick that keeps the note inventory stocked.
#
# WHY A CLOCK AND NOT A TRIGGER
# ─────────────────────────────
# MEASURED 2026-08-28: a relayed deposit follows its buyer's payment to the till
# by a FIXED 48-50 seconds, on 4 deposits out of 4. That gap is what lets an
# analyst say which deposit belongs to whom, it is written at deposit time, and
# no later delay takes it back off.
#
# ⛔ SO THIS MUST NEVER FIRE BECAUSE SOMEONE BOUGHT. Re-depositing in reaction to
# a sale rebuilds exactly that gap one layer up: every restock would timestamp a
# purchase, and the pre-deposited inventory would stop being worth building. The
# schedule is the mechanism, not the convenience.
#
# The job also waits a random spell before its first deposit. A cron at :41 makes
# "the deposits near :41" a recognisable class, and an anonymity set an observer
# can partition is smaller than its count claims.
#
# WHY GITHUB AND NOT vercel.json
# ──────────────────────────────
# Same reason as `settle-till.yml`: Hobby allows two cron jobs, daily, and the
# waitlist holds both. It is also far past a Vercel function's limit — one
# deposit is a ~2 minute proof plus ~96 transactions, so a run is tens of
# minutes by design.
#
# ⚠️ GitHub disables scheduled workflows in a repository with no activity for 60
# days and emails the owner. An inventory nobody notices has stopped refilling
# is a deployment that answers 503 to paying customers, so treat that mail as an
# alarm rather than noise.

name: restock-inventory

on:
  schedule:
    # Every four hours at :41. Off the hour for the same reason settle-till is:
    # the top of the hour is GitHub's busiest slot, so it runs late there.
    - cron: '41 */4 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'How many notes the pot should hold'
        required: false
        default: '10'

# ⛔ ONE TICK AT A TIME, and this one is not advisory. Two runs shielding at once
# would race for the pool's Merkle root: `shield_denominated_v3` binds the C6
# proof to `merkle_tree.root` as it is at execution, so the loser fails
# `InvalidProof` after its payer has already paid.
concurrency:
  group: restock-inventory
  cancel-in-progress: false

# ⛔ WHAT THE RUNNER SHOWS IS PUBLIC TOO, not only what a step echoes: each
# step's name, each action's inputs, and each run step's env block with its
# values. GitHub masks a secret only as its exact string, so an expression
# derived from one (`fromJSON(secrets.X)[0]`, `startsWith(secrets.X, 'a')`)
# shows in clear. So an expression is the WHOLE value of an env entry and sits
# nowhere else, and every env value, `with:` input and `if:` below is pinned
# by its step and its exact text in
# apps/web/lib/privacy/pool/ciLogHygiene.test.ts, case "the public workflows
# echo no response body and run the restock silently" (mutants Z3, E1, E3,
# E5-E7: web-run/logs/CI-1-wr3b-mutants-after.log).
#
# ⛔ EVERY LINE OF THIS FILE THAT IS NOT A COMMENT IS PINNED, by its exact text
# and in order, in that same case (VETTED_WORKFLOW_LINES). Changing one, a new
# low-water mark say, turns it red until the list changes with it, which is
# the point: a change to this job is read. A comment or blank line is free,
# except inside a `\` continuation (bash splits the command there) and at an
# indentation other than the line below it (web-run/logs2/CI-1-cr1-*).
jobs:
  restock:
    name: Restock the note inventory
    runs-on: ubuntu-latest
    # Generous: the job deliberately sleeps a random spell before it starts, and
    # each deposit is a ~2 minute proof plus ~96 transactions.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # WHERE THE RESTOCK'S MONEY COMES FROM
      # ────────────────────────────────────
      # Buyers pay the till; settle-till moves the till into the float F and
      # nowhere else. The restock below spends a THIRD wallet down to its floor,
      # and until 2026-09-02 nothing moved F to that wallet: the takings reached
      # F and stopped, this job logged FLOOR every tick, and issue-note answered
      # 503 with the SOL one hop away. This step is the hop. It moves the
      # smaller of (F above its own floor) and (the restock wallet below its
      # target), only after F has been quiet for the settlement's quiet period,
      # after a random delay, and refuses when F's history cannot be read.
      # Arithmetic and clock: apps/web/lib/privacy/pool/restockTopUp.ts.
      #
      # BEFORE the restock, so the deposits have something to spend. Secrets
      # are referenced by name and read from the environment by the script,
      # which says what happened only through apps/web/lib/privacy/ciLog.ts:
      # one allowlisted verdict, or one redacted ::error::, into the verdict
      # file the "Say what happened" step prints.
      #
      # ⛔ ITS OWN STDOUT AND STDERR GO TO PRIVATE FILES, and not by
      # preference. web3.js prints the transfer signature on its own when a
      # websocket subscribe fails, in a retry loop: run against a fake RPC,
      # the step log carried it 43,720 times
      # (web-run/logs/verify-CI-1-r1-topup-probe-wserror.log). The script now
      # confirms by status polling, which removes that one print at its
      # source; the redirect is for whatever else a library prints, which
      # nothing this repository writes can refuse. RUNNER_TEMP is emptied at
      # the end of the job. Pinned by
      # apps/web/lib/privacy/pool/ciLogHygiene.test.ts, case "the public
      # workflows echo no response body and run the restock silently", which
      # vets this command by its exact line, both redirects included, and
      # refuses a redirect into the verdict file. Private streams do not make
      # any OTHER command innocent there: a command can copy these files into
      # the step summary or the verdict file by argument, so every command in
      # this job that is not echo, printf or a quiet shell word is vetted by
      # its line.
      #
      # continue-on-error, deliberately: a missing float key or a failed
      # transfer must show as a red step with an ::error:: annotation, but it
      # must not stop the restock from running on whatever the wallet holds.
      - name: Top up the restock wallet from the float
        working-directory: apps/web
        continue-on-error: true
        env:
          P01_FUNDER_SECRET_KEY: ${{ secrets.P01_FUNDER_SECRET_KEY }}
          P01_TREASURY_KEYPAIR_JSON: ${{ secrets.P01_TREASURY_KEYPAIR_JSON }}
          P01_LIVE_RPC: ${{ secrets.P01_FUNDER_RPC }}
          # The same four numbers the restock step reads, so both agree on the
          # wallet's target. Kept in lockstep with the Restock step below.
          P01_TREASURY_TARGET: ${{ github.event.inputs.target || '10' }}
          P01_TREASURY_LOW_WATER: '7'
          P01_TREASURY_MAX_PER_RUN: '3'
          # The settlement policy as the deployment runs it. Repository
          # variables, optional: unset means the policy's own defaults, which
          # are also the deployment's unless it overrode them.
          P01_SETTLE_MIN_PURCHASES: ${{ vars.P01_SETTLE_MIN_PURCHASES }}
          P01_SETTLE_MIN_QUIET_SECONDS: ${{ vars.P01_SETTLE_MIN_QUIET_SECONDS }}
          # Where lib/privacy/ciLog.ts appends the verdict or the redacted
          # ::error::. "Say what happened" prints it, and it is this step's
          # only way onto the public log besides the step summary: the
          # command below keeps both of its streams private (pinned by
          # apps/web/lib/privacy/pool/ciLogHygiene.test.ts, "the public
          # workflows echo no response body and run the restock silently").
          P01_CI_VERDICT_FILE: ${{ format('{0}/ci-verdicts.txt', runner.temp) }}
        run: |
          npx tsx scripts/topUpRestockWallet.mts > "$RUNNER_TEMP/topup.out" 2> "$RUNNER_TEMP/topup.err"

      # [2026-09-12] The stock, read from the live deployment BEFORE the key is
      # needed. This job had failed on every one of its 4-hourly runs since at
      # least 2026-09-05 — "P01_TREASURY_KEYPAIR_JSON is unset" — while the
      # inventory it exists to refill held 318 notes against a target of 10. A
      # failure e-mail six times a day about a pot that is full is noise, and
      # noise is how the one that matters gets ignored. So: with the secret
      # absent AND the pot at or above the low-water mark, the run says so and
      # ends green; with the secret absent and the pot LOW, it still fails, as
      # loudly as before. Adding the secret restores the restock itself.
      - name: Read the live stock
        id: stock
        env:
          P01_BASE: https://protocol-01.dev
        run: |
          size=$(curl -sf "$P01_BASE/api/issue-note" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(Number.isInteger(j.inventorySize)?j.inventorySize:'')}catch{console.log('')}})")
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "live inventory: ${size:-unknown} notes"

      - name: Write the treasury keypair
        id: keypair
        # ⚠️ The file, never an env var read by the app: the harness loads a
        # keypair path, and a key that only exists for this step is a key that
        # does not leak into a later one.
        env:
          TREASURY_KEYPAIR_JSON: ${{ secrets.P01_TREASURY_KEYPAIR_JSON }}
          STOCK: ${{ steps.stock.outputs.size }}
          P01_TREASURY_LOW_WATER: '7'
        run: |
          if [ -z "$TREASURY_KEYPAIR_JSON" ]; then
            if [ -n "$STOCK" ] && [ "$STOCK" -ge "$P01_TREASURY_LOW_WATER" ]; then
              echo "::warning::P01_TREASURY_KEYPAIR_JSON is unset, but the live inventory holds $STOCK notes (low water $P01_TREASURY_LOW_WATER): nothing to restock, skipping."
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::P01_TREASURY_KEYPAIR_JSON is unset and the live inventory is ${STOCK:-unknown} (low water $P01_TREASURY_LOW_WATER): the pot cannot be refilled"
            exit 1
          fi
          printf '%s' "$TREASURY_KEYPAIR_JSON" > "$RUNNER_TEMP/treasury.json"

      - name: Restock
        if: steps.keypair.outputs.skip != '1'
        working-directory: apps/web
        env:
          P01_RESTOCK: '1'
          P01_LIVE_KEYPAIR: ${{ format('{0}/treasury.json', runner.temp) }}
          P01_LIVE_RPC: ${{ secrets.P01_FUNDER_RPC }}
          P01_TREASURY_NOTE_LEAVES: ${{ secrets.P01_TREASURY_NOTE_LEAVES }}
          P01_TREASURY_TARGET: ${{ github.event.inputs.target || '10' }}
          P01_TREASURY_LOW_WATER: '7'
          P01_TREASURY_MAX_PER_RUN: '3'
          NODE_OPTIONS: --max-old-space-size=8192
          P01_CI_VERDICT_FILE: ${{ format('{0}/ci-verdicts.txt', runner.temp) }}
        # ⛔ --silent, and not by preference. This log is public (ledger row
        # E5): without it every console.warn from the pool library lands here,
        # and prepareUnshield / prepareUnshieldV4 in
        # apps/web/lib/privacy/pool/denominatedPool.ts print missing leaf gaps
        # BY INDEX — named by function, not by line, because those two lines
        # have already moved once. --reporter=dot does the same for the
        # reporter. The job says what happened through the verdict file,
        # printed by the step below.
        #
        # ⚠️ IT SILENCES console.*, NOT THE PROCESS STREAMS. Measured on the
        # same two runs: a console.warn goes 1 hit -> 0 hits with these flags,
        # a raw process.stdout.write stays at 1. The offender named above uses
        # console.warn, so this closes it; what covers a message THROWN by the
        # library is the ciRedactedError rethrow in restockInventory.test.ts,
        # not this flag. Pinned by
        # apps/web/lib/privacy/pool/ciLogHygiene.test.ts, which reads the flags
        # off the vitest COMMAND with the comments stripped, so this comment
        # cannot satisfy it.
        #
        # ⚠️ --silent IS ONLY AS GOOD AS WHAT ELSE VITEST LOADS. One key in the
        # config, `disableConsoleIntercept: true`, turned it off;
        # --disableConsoleIntercept=false takes that back. A setupFiles in the
        # config, a vitest.workspace.* beside it, a NODE_OPTIONS preload or an
        # npm node-options in apps/web/.npmrc also turned it off, and no flag
        # takes those back. So the same test evaluates vitest.pool.config.mts
        # against a closed shape, refuses a workspace file beside it, and holds
        # every env block here and apps/web/.npmrc to closed key sets (case "the
        # public workflows echo no response body and run the restock silently").
        run: |
          npx vitest run --config vitest.pool.config.mts --silent --reporter=dot \
            --disableConsoleIntercept=false \
            lib/privacy/pool/restockInventory.test.ts

      # The verdict file both steps above write through
      # apps/web/lib/privacy/ciLog.ts: allowlisted words, at most one count
      # (how many deposits landed, which the chain shows anyway), and the
      # top-up's redacted ::error:: line, which GitHub raises as an annotation
      # here (pinned by apps/web/lib/privacy/pool/ciLogHygiene.test.ts, "ciSay
      # refuses a word or a number nothing allowlisted (positive control)" and
      # "a verdict goes to the file the workflow prints, and to stdout when
      # there is none"). The Restock step's own output (vitest's dots and a
      # redacted failure) is the other public text of this job.
      - name: Say what happened
        if: always()
        env:
          P01_CI_VERDICT_FILE: ${{ format('{0}/ci-verdicts.txt', runner.temp) }}
        run: |
          if [ -s "$P01_CI_VERDICT_FILE" ]; then
            cat "$P01_CI_VERDICT_FILE"
          else
            echo "no verdict was recorded"
          fi

      - name: Shred the key
        if: always()
        run: shred -u "$RUNNER_TEMP/treasury.json" 2>/dev/null || rm -f "$RUNNER_TEMP/treasury.json"
