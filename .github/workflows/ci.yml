name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ts-lint-build-test:
    name: TS — Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.34.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # THE DEPLOYMENT INTERLOCK. The three WASM gates further down (twins,
      # wireFormat, wasmProbeScan) all compare the blob to THIS TREE and are green
      # whenever the tree agrees with itself. None of them has ever looked at the
      # chain. This step runs BEFORE `turbo run build` on purpose: `apps/web` and
      # `apps/extension` now run the same script in their own build scripts, so
      # without this the job would go red inside a bundler log instead of under a
      # name that says what broke.
      #
      # A client one proof-format generation ahead of the deployed verifier
      # builds fine, serialises fine, uploads all ~78 KB in chunks and then fails
      # on the LAST instruction with FriFoldCheckFailed — which reads as an
      # unexplained transaction failure, not as a version skew.
      #
      # EXPECTED RED as of 2026-07-30: packages/stark-prover/wasm/ holds the B1
      # prover, devnet EXmAQqmk… still runs pre-B1 bytes (measured off the
      # programdata account, see packages/stark-prover/deployed-verifier.json).
      # The ONLY legitimate way to turn it green is to deploy
      # programs/p01_stark_verifier and then re-measure the record with
      # `--measure`. Editing the record instead makes the OFFLINE half green and
      # changes nothing on chain, which is why `--verify-onchain` is passed here:
      # it refetches the programdata account and re-derives the deployed
      # generation from the deployed bytes. An unreachable cluster is reported as
      # SKIPPED and does not fail the step, so a network flake cannot block a
      # merge; a reachable cluster that contradicts the record is a hard failure.
      #
      # The same script runs in `apps/web` build, `apps/extension` build,
      # `apps/mobile` eas-build-post-install and both `prepublishOnly` hooks, so
      # this is not a CI-only gate.
      - name: STARK prover vs DEPLOYED verifier (BLOCKING — proof-format interlock)
        run: node packages/stark-prover/scripts/deployed-verifier-check.mjs --verify-onchain

      - name: Type check & Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test --continue

      # [PROVER ARTIFACT SKEW] BLOCKING, and separate from `pnpm turbo run test`
      # above because that runs with `--continue` and this must not be advisory.
      #
      # `packages/stark-prover/wasm/p01_stark_bg.wasm` is a git-tracked,
      # npm-published, PREBUILT binary — the prover every client actually runs
      # (extension service worker, mobile WebView, privacy-SDK loader), inlined as
      # base64 into four more tracked files. Nothing in this repo rebuilt any of
      # them: there is no `wasm-pack` step in any package.json or workflow.
      #
      # MEASURED before the Route C reship: the checked-in blob emitted a 79,993-byte
      # circuit-0 proof while the Rust prover at the same commit emitted 45,001 —
      # i.e. the shipped prover predated B4, the domain-separation tags AND Route C,
      # so every client-generated proof was old-format against the on-chain verifier.
      # It fails closed, so that was a functional break of the shipped proving path
      # rather than a soundness hole. Nothing detected it: the only assertion on WASM
      # output anywhere was `expect(proofBytes.length).toBeGreaterThan(1024)`.
      #
      # Three gates, because they catch different failures:
      #   --check         every inlined twin carries the SAME bytes as the
      #                   canonical blob (catches a PARTIAL reship)
      #   wireFormat      the canonical blob's seven proof LENGTHS equal the
      #                   literals `route_c_trace_pair.rs` pins for the Rust
      #                   prover, AND all seven sha256 CONTENT digests match the
      #                   Rust prover (catches a STALE reship — all five copies
      #                   agreeing on the wrong bytes; B1-class skew is
      #                   length-preserving, so the digests are the half that
      #                   catches it). MEASURED negative control: restoring the
      #                   pre-B1 blob 5fe610c9… leaves every LENGTH assertion
      #                   green and turns all seven digests red.
      #   wasmProbeScan   no fails-closed probe identifier (OodForgery,
      #                   AliasedFold, LegacyRowLeaf, …) survives in the blob or
      #                   in any twin. Those knobs are `#[cfg(feature =
      #                   "test-probes")]` in stark/src/compact.rs and the
      #                   feature is off in `default`, so a hit here means the
      #                   blob was built WITH the feature or a new probe landed
      #                   ungated. MEASURED negative control: the pre-gate blob
      #                   f4f2cb09… turns 6 canonical checks and all 4 twin
      #                   checks red.
      #
      # Regenerate with (never add `--features test-probes`):
      #   wasm-pack build stark --target web --out-dir wasm-out -- --features wasm
      #   cp stark/wasm-out/p01_stark_bg.wasm packages/stark-prover/wasm/
      #   cp stark/wasm-out/p01_stark.js      packages/stark-prover/wasm/
      #   node packages/stark-prover/scripts/stark-wasm-twins.mjs --write
      - name: WASM prover artifact skew (BLOCKING — twins + wire-format pin)
        run: |
          node packages/stark-prover/scripts/stark-wasm-twins.mjs --check
          pnpm --filter @protocol-01/stark-prover test

      # Named separately from the step above so a probe leak is legible in the
      # checks list rather than buried in a 50-test vitest run. `vitest run` in
      # the previous step already executes this file; running it again on its own
      # costs ~1s (it is a byte scan, no proof generation) and is what makes the
      # gate merge-blocking BY NAME.
      - name: WASM prover probe leak (BLOCKING — no attack code in the shipped blob)
        run: pnpm --filter @protocol-01/stark-prover exec vitest run src/wasmProbeScan.test.ts

  rust-programs-build:
    name: Rust — Programs cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The SBF toolchain `Anchor.toml:3` pins (`solana_version = "3.1.9"`, which
    # ships platform-tools v1.52). This job used to install agave 2.2.14 instead.
    # See the install step below for why that is not a detail.
    env:
      SOLANA_VERSION: "3.1.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Needed by the proof-buffer gate step below: those tests build real SBF
      # bytecode with cargo-build-sbf and execute it under litesvm. Without a
      # Solana CLI here the harness panics (by design — it never skips and
      # passes), so this install is part of the gate, not a convenience.
      #
      # [TOOLCHAIN] This installed agave 2.2.14 (platform-tools v1.47) while
      # `Anchor.toml:3` pins 3.1.9 (v1.52). For the accept/reject gates below that
      # is harmless — they assert a decision, and the decision is a property of the
      # program, not of the compiler. For the CU gate it is not: `CU_CEILINGS` pins
      # the COST OF BYTECODE, the same `src/` through two platform-tools is not the
      # same bytecode, and every one of those numbers was measured with 3.1.9. So a
      # red CU step meant either a regression or a compiler difference, nothing said
      # which, and the only thing absorbing the gap was a 2% band.
      #
      # The gap cannot be quantified: on the founder's box 2.2.14 dies with
      # `Failed to install platform-tools: os error 183`, so nobody can measure what
      # it costs. It is therefore removed rather than measured — CI now builds with
      # the same compiler the pins were taken with, and the step below asserts that
      # rather than assuming it.
      - name: Install Solana CLI (Agave) — required by the SBF gate tests
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # `CU_MEASURED_WITH` in tests/cu_budget.rs records the compiler `CU_CEILINGS`
      # was measured with. It is READ OUT OF THE RUST rather than restated here, so
      # the two cannot drift, and an unreadable constant fails this step instead of
      # silently comparing against an empty string.
      #
      # A mismatch is a hard failure on purpose. If this ever fires, the CU numbers
      # downstream would be gated against bytecode from a different platform-tools,
      # and that is precisely the ambiguity this job no longer carries. Fix it by
      # re-measuring and re-pinning CU_CEILINGS, not by deleting this step.
      - name: Assert the SBF compiler is the one CU_CEILINGS was measured with
        run: |
          SBF="$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf"
          test -x "$SBF" || { echo "cargo-build-sbf missing at $SBF"; exit 1; }
          got="$("$SBF" --version 2>&1 | tr '\n' ' ' | tr -s ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          want="$(sed -n 's/^const CU_MEASURED_WITH: &str = "\(.*\)";$/\1/p' programs/p01_stark_verifier/tests/cu_budget.rs)"
          echo "cargo-build-sbf --version : $got"
          echo "CU_MEASURED_WITH          : $want"
          if [ -z "$want" ]; then
            echo "::error title=CU_MEASURED_WITH unreadable::could not parse CU_MEASURED_WITH out of programs/p01_stark_verifier/tests/cu_budget.rs — this step cannot compare anything, so it fails rather than passing vacuously"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error title=SBF toolchain drift::CU_CEILINGS was measured with '$want', this runner has '$got'. CU is a property of bytecode, so the CU gate downstream would be red for two possible reasons with no way to tell them apart. Re-measure and re-pin CU_CEILINGS with this compiler, or restore the pinned one."
            exit 1
          fi

      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ env.SOLANA_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # p01-arcium is excluded because its Arcium macros
      # (init_computation_definition_accounts, queue_computation_accounts,
      # callback_accounts, arcium_callback) read .arcis bytecode files from
      # programs/p01_arcium/build/ at proc-macro expansion time. Those files
      # are produced by `arcium build` (Arcium CLI / Arcis compiler), not by
      # cargo, and are gitignored. CI does not have the Arcium toolchain.
      # Local devs run `arcium build` once, then `cargo check` works there.
      - name: cargo check (workspace, excl. p01-arcium)
        run: cargo check --workspace --all-targets --exclude p01-arcium --exclude encrypted-ixs

      # This is a real gate, not a formality. `eval_periodic_stride_at_z` and
      # `eval_periodic_ext_at_z` in the verifier perform NO runtime validation
      # by design — a sparsity scan would cost exactly what the rewrite saves —
      # so `tests/periodic_stride.rs` IS the entire safety argument for the A3
      # and A4 periodic-column rewrites. It re-derives every constant from the
      # dense tables in `periodic_consts.rs` and fails if a rebake was not
      # mirrored. `cargo check --all-targets` COMPILES these tests but never
      # runs them, so until this step existed the pin was never executed.
      #
      # Release mode is required: the older `eval_periodic_stride16_at_z` hides
      # its sparsity check behind `#[cfg(debug_assertions)]`, so a debug-only
      # run would not exercise the profile that actually ships.
      #
      # [B4] `tests/b4_pair_leaf.rs` is the fails-closed guard for the pair-leaf
      # Merkle commitment. The pair index, the order of the two halves inside a
      # leaf, and the path depth are agreed between prover and verifier but
      # never travel on the wire, so nothing else catches a drift. That test
      # runs the prover under three deliberately different pair layouts and
      # asserts the verifier rejects each with MerkleProofFailed. If it is not
      # executed, a silent prover/verifier disagreement is possible.
      # [DOMAIN SEP] `tests/merkle_domain_sep.rs` is the fails-closed guard for
      # Merkle leaf/node domain separation. Untagged, `leaf = SHA256(preimage)`
      # and `node = SHA256(l ‖ r)` were the SAME function, so a genuine internal
      # node could be re-presented as a leaf whose preimage is that node's own
      # two children, with the node's real siblings as the path — and the walk
      # landed on the real root. Nothing else in the suite catches that: every
      # other test opens leaves the prover actually built, so it never asks the
      # question. The test also pins the prover's tags against the verifier's;
      # the two crates declare them independently and a one-sided edit breaks
      # every honest proof.
      # [ROUTE C] `tests/route_c_trace_pair.rs` is the fails-closed guard for the
      # pair-leaf TRACE commitment. Two things need guarding that nothing else
      # covers:
      #   1. The version-skew seam. Prover and verifier must agree on the pair
      #      index, which row is the low half, the path depth, and the fact that
      #      the tree is pair-leafed at all — none of which travel on the wire. At
      #      trace_width == 4 (C2, C4) the old and new wire formats are the SAME
      #      NUMBER OF BYTES, so every length check passes and the Merkle check is
      #      the only thing that rejects an old-format proof. Measured: with the
      #      trace openings removed, an old-format C4 proof gets all the way to
      #      TransitionConstraintFailed.
      #   2. The mirror rows. Route C puts two extra trace rows per query on the
      #      wire. They are authenticated and — in this revision — never read, so
      #      no other test would notice if they stopped being bound to trace_root.
      # It also pins the C0 gate: circuit 0 must be refused by name on the generic
      # dispatch, because the generic path cannot verify an honest C0 proof
      # (measured: DeepAliFailed) while four shipped instructions require id 0.
      #
      # `route_c_trace_pair::all_four_trace_authentication_call_sites_are_present`
      # is the pre-land assertion. MEASURED during the round-3 review: a concurrent
      # process deleted ALL FOUR `verify_merkle_path_2seg` blocks from verify.rs —
      # both in `verify_merkle_proofs_generic` and both in the legacy C0 path — and
      # `git status` read ` M verify.rs` before and after, identically. That test
      # counts the call sites in the source on disk and names the missing surface,
      # so a half-restored tree cannot be landed by someone who sees green elsewhere.
      - name: cargo test (verifier — the periodic-column, field, pair-leaf, domain-sep and Route-C pins)
        run: |
          cargo test -p p01_stark_verifier --lib
          cargo test -p p01_stark_verifier --release --test periodic_stride
          cargo test -p p01_stark_verifier --release --test fri_end_to_end
          cargo test -p p01_stark_verifier --release --test b4_pair_leaf
          cargo test -p p01_stark_verifier --release --test merkle_domain_sep
          cargo test -p p01_stark_verifier --release --test route_c_trace_pair
          # [B1] The coordinated-forgery suite. Listing it here is what makes it a
          # gate: unfiltered `cargo test -p p01_stark_verifier` is never what CI
          # runs (a4_probe.rs is in no workflow), and anchor-test.yml runs no
          # p01_stark_verifier suite at all, so ci.yml is the only place it lands.
          # It is the ONLY test in the repo that distinguishes a working DEEP
          # binding from a broken one — the twelve existing tampered-OOD tests
          # pass against a verifier with no binding whatsoever, because a byte
          # patch desynchronises the grinding transcript before FRI is reached.
          cargo test -p p01_stark_verifier --release --test b1_deep_binding

      # [PROVER] The prover half of every pin above, plus the LDE coset sequencing
      # companion (`compact::lde_coset_sequencing::lde_has_no_coset_offset_measured_today`).
      # That test is GREEN today and goes RED the moment an LDE coset offset lands —
      # deliberately, so the coset fix cannot be landed without touching the tripwire
      # it unblocks. `aligned_hits_is_zero_once_the_domain_is_shifted` is its positive
      # control, so `hits == checked` cannot be a predicate that is simply always true.
      - name: cargo test (prover — p01-stark lib pins incl. the LDE coset companion)
        run: cargo test -p p01-stark --lib --release

      # [SEQUENCING] Route C's mirror rows are authenticated and NEVER READ in this
      # revision (probed: 1,296 single-bit flips on C1 produced exactly one outcome,
      # MerkleProofFailed — no constraint/DEEP/FRI step reads them). So on its own
      # Route C buys +704/+1,056/+2,112 bytes on the three largest circuits and a 2x
      # amplification of the LIVE raw-witness leak, with the soundness benefit arriving
      # only when step 4's H recomputation consumes those rows.
      #
      # This step prints the verdict and does NOT fail the job. The tripwire test is
      # RED when run, by design, and a permanently-red required step gets deleted
      # rather than obeyed (see the clippy --all-targets note above for the same
      # failure mode). The MECHANICAL enforcement is the companion test in the
      # blocking step above, which goes red when the coset fix lands.
      #
      # Two ways to clear it: land the LDE coset offset, or hold the Route C wire
      # change until step 4 ships with it.
      - name: LDE coset sequencing tripwire (ADVISORY — RED BY DESIGN until the coset fix)
        run: |
          echo "::group::LDE coset sequencing verdict"
          cargo test -p p01-stark --lib --release lde_coset_sequencing -- --ignored --nocapture \
            || echo "::warning title=Route C sequencing::LDE has no coset offset — Route C must NOT reach a deployed verifier. Land the coset offset, or hold the Route C wire change until step 4."
          echo "::endgroup::"
        continue-on-error: true

      # STARK verification of circuits 1-6 is two instructions:
      #   verify_stark_proof_v2   -> ProofBuffer.verified          (byte 49)
      #   verify_deep_ali_phase2  -> ProofBuffer.deep_ali_verified (byte 82)
      # Phase 1 alone is not an AIR check — `verify_quotient_at_query` enforces
      # nothing and boundary constraints fire only on a query that is both
      # trace-aligned and on an assertion row — so a consumer gating on byte 49
      # alone accepts a proof whose declared public inputs are bound to nothing.
      # p01_liquidity::prefund and every p01_zkspl proof consumer did exactly
      # that, and both were demonstrated paying out under litesvm on a
      # hand-built phase-1-only buffer.
      #
      # `--lib` pins the byte LAYOUTS the gates read (min length 83, flag at 82,
      # inputs-hash slice stopping before it, DenominatedPool field offsets).
      # It does NOT execute a single `require!`: measured during review, both
      # `require!(deep_ali_verified, ..)` lines were deleted and `--lib` stayed
      # green on both crates. So it runs here as a layout pin and nothing more.
      #
      # `--test deep_ali_gate` is the actual gate. Each harness compiles the
      # crate to real SBF bytecode (its own --sbf-out-dir + CARGO_TARGET_DIR,
      # cached on a content fingerprint of src/, so it can never be a gate on
      # stale bytes in target/deploy/) and asserts the accept/reject decision a
      # validator would make. A missing build tool panics with the compiler
      # output; it never skips and passes.
      #
      # Covered: the DEEP-ALI gate on prefund/withdraw/prove_balance; prefund's
      # payout binding (`amount == denomination`), its pool allowlist
      # (`denominated_pool.authority == pool.admin`, since zk_shielded pool
      # creation is permissionless and the denomination is otherwise
      # attacker-chosen), its replay bound (PrefundRecord keyed on the proven
      # `nullifier[..8]`), and the `init_pool` kill switch. Each file carries
      # positive controls, so "reject everything" cannot make this step green.
      - name: cargo test (proof-buffer gate — layout pins, no require! executed)
        run: |
          cargo test -p p01_liquidity --lib
          cargo test -p p01_zkspl --lib

      # P01_CARGO_BUILD_SBF is set explicitly rather than left to the harness's
      # PATH fallback: a silent fallback to a different tool is the kind of
      # thing that turns a gate into a coin flip. `test -x` fails the job if the
      # install step did not produce it.
      #
      # These two moved from 2.2.14 to 3.1.9 as a side effect of the install pin
      # above. They assert an accept/reject decision rather than a cost, so the
      # compiler is not load-bearing here — but it still has to compile them.
      # MEASURED before the pin was changed, with the 3.1.9 cargo-build-sbf and a
      # CARGO_TARGET_DIR that did not exist: p01_liquidity exit 0, 328,344 B .so;
      # p01_zkspl exit 0, 344,552 B .so.
      - name: cargo test (proof-buffer + payout gates, real SBF bytecode under litesvm)
        run: |
          export P01_CARGO_BUILD_SBF="$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf"
          test -x "$P01_CARGO_BUILD_SBF" || { echo "cargo-build-sbf missing at $P01_CARGO_BUILD_SBF"; exit 1; }
          cargo test -p p01_liquidity --test deep_ali_gate -- --nocapture
          cargo test -p p01_zkspl     --test deep_ali_gate -- --nocapture

      # [CU] `tests/cu_budget.rs` is the ONLY thing in this repo that measures compute
      # units or proof bytes against real SBF bytecode, and until this step existed it
      # appeared in no workflow — so the 1,400,000 CU ceiling was never checked
      # automatically and Route C's +2,112 B / +3 chunks on C6 was caught by nothing.
      #
      # Two round-3 fixes make it a gate rather than a table:
      #   * It BUILDS the .so it measures (its own --sbf-out-dir + CARGO_TARGET_DIR,
      #     cached on a content fingerprint of src/), so there is no path by which it
      #     reports CU for bytes that predate the change under test. The old behaviour
      #     was a `println!` warning, and MEASURED: a green run on stale bytes happened
      #     during this very step's development.
      #     That fingerprint now covers the COMPILER too (`cargo-build-sbf --version`,
      #     which reports the platform-tools version with it). It did not, and MEASURED
      #     on the source-only key: with target/cu-budget holding a 3.1.9 build, re-running
      #     with P01_CARGO_BUILD_SBF pointed at agave 2.2.14 printed `cache hit` and
      #     re-reported the 3.1.9 numbers under an unchanged .so sha256. Back then this
      #     step exported P01_CARGO_BUILD_SBF=active_release with 2.2.14 installed while
      #     Anchor.toml:3 pinned 3.1.9, so CI and a local run were one env var apart and
      #     the trap was live. `build_fingerprint_changes_when_the_compiler_changes` is
      #     the pin, and it is a pin on the CACHE KEY, not on which compiler CI picks —
      #     it makes a switch visible, it never made the two equal.
      #     RE-MEASURED end to end when this step was pinned, on the same trap: with
      #     target/cu-budget holding the valid 3.1.9 build under fingerprint
      #     28cc268b11fd8b8a, re-running with P01_CARGO_BUILD_SBF pointed at 2.2.14
      #     printed `build fingerprint 2dd5590bccda83a2 — rebuilding`, not `cache hit`,
      #     and then panicked (exit 101) on 2.2.14's own platform-tools install. So the
      #     compiler is still genuinely in the key, and the harness still fails closed.
      #     What makes them equal is the install step above: this job now installs the
      #     3.1.9 Anchor.toml pins, and `Assert the SBF compiler is the one CU_CEILINGS
      #     was measured with` fails the job before this step runs if it is ever not.
      #     Belt and braces, because a CI file is easy to edit: `toolchain_caveat` in
      #     the harness compares the live compiler against CU_MEASURED_WITH and, on a
      #     mismatch, prints the gap above the ceiling table AND inside every violation.
      #     So a red here is a regression, and on the day it is not, it says so itself.
      #   * `CU_CEILINGS` pins phase-1 and phase-2 CU per circuit at measured*1.02.
      #     Before that, nothing bounded CU from above except the 1,400,000 cap, so C0's
      #     538,666 could have become 1,399,000 and stayed green.
      #     `cu_ceiling_check_rejects_a_regression_and_accepts_the_recorded_numbers`
      #     carries the positive and negative controls, so "reject nothing" cannot make
      #     this step green.
      #
      # The harness now asserts the OTHER ceiling as well. Every proof is padded to
      # UNIFORM_PROOF_SIZE (145,000 B) before upload so the buffer length leaks nothing
      # about which circuit ran, and a proof over that cannot be padded to it. Nothing
      # in Rust checked: `145_000` appeared in no .rs file, cu_budget carried proof_bytes
      # on every row and only PRINTED it, and the sole enforcement anywhere was a runtime
      # `throw` in padProofToUniform on a user's phone, after proving. Largest today is C6
      # at 78,517 B; docs/C7_SPEND_CIRCUIT_PLAN.md:15 already projects ~160 KB for C7,
      # which is 15,000 B over. The Rust constant is parsed out of
      # apps/mobile/services/stark/index.ts so the two languages cannot drift.
      #
      # --release is not optional: the harness generates eleven real STARK proofs.
      # `cu_budget_c7_phase2_probe` is filtered out — its throwaway probe program is
      # gitignored, and a missing artifact is a panic by design, so it cannot run here.
      - name: cargo test (CU budget — measured CU + proof bytes, self-built SBF bytecode)
        run: |
          export P01_CARGO_BUILD_SBF="$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf"
          test -x "$P01_CARGO_BUILD_SBF" || { echo "cargo-build-sbf missing at $P01_CARGO_BUILD_SBF"; exit 1; }
          cargo test -p p01_stark_verifier --release --test cu_budget \
            -- --nocapture --test-threads=1 \
            cu_budget_real_circuits cu_budget_verify_uniform_path cu_ceiling \
            build_fingerprint proof_size_envelope toolchain_caveat

      # [ROUTE C] `p01_stark_verifier` is split out and BLOCKING. It was under the
      # shared `continue-on-error: true` below, which made every warning on it
      # advisory — including the unused-variable warning that is the only signal a
      # PARTIAL deletion of the trace-commitment check leaves behind. MEASURED
      # during review: with all four `verify_merkle_path_2seg` blocks removed but
      # their `let (lo, hi) = ...` locals left in place, clippy is the only gate
      # that reacts, and `continue-on-error` swallowed it.
      #
      # MEASURED here, on the tree this comment ships with:
      #   cargo clippy -p p01_stark_verifier -- -D warnings           -> exit 0
      #   cargo clippy -p p01_stark_verifier --all-targets -- -D ...  -> 105 errors
      # so this is deliberately NOT `--all-targets`. `--all-targets` builds the
      # dev-dependency `p01-stark`, which carries 105 untriaged clippy findings
      # (`too_many_arguments` and friends). Widening the scope here would make the
      # step permanently red and it would be reverted, which is worse than the
      # narrower gate. Triaging `p01-stark` is a separate job.
      - name: cargo clippy (BLOCKING — verifier)
        run: cargo clippy -p p01_stark_verifier -- -D warnings

      # These two still carry pre-existing warnings that nobody has triaged, so
      # they stay advisory. Do not fold the verifier back in here.
      - name: cargo clippy (advisory — zk_shielded, relayer)
        run: |
          cargo clippy -p zk_shielded -- -D warnings
          cargo clippy -p p01_relayer -- -D warnings
        continue-on-error: true
