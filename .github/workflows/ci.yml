name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ts-lint-build-test:
    name: TS — Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 9.15.9, not 10.x, and the number here is decorative either way: root
      # package.json pins `"packageManager": "pnpm@9.15.9"` and pnpm 10
      # self-manages down to that pin on first invocation. MEASURED:
      # `npx -y pnpm@10.34.0 --version` prints 9.15.9. So this line said 10.34.0
      # while CI ran 9.15.9 — no behavioural drift, but the repo was pinned to
      # 9.15.9 ON PURPOSE after pnpm 10 broke the Android build, and a future
      # edit to a number that is never obeyed would look effective and be inert.
      # Change the packageManager field, not this line.
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      # [ENGINE CONTRADICTION — UNRESOLVED ON PURPOSE, DO NOT "FIX" BY LOOSENING
      # apps/web] Three declarations disagree:
      #   root package.json      "node": ">=22"
      #   apps/web/package.json  "node": "24.x"
      #   this step              node-version: 22
      # `semver.satisfies("22.22.0", "24.x")` is false, so every `pnpm install` on
      # this runner prints `WARN Unsupported engine` for apps/web. engine-strict is
      # not set in .npmrc, so it stays a warning and the job stays green.
      #
      # It is NOT an accident and must not be widened back to ">=22". ddbeda3e
      # pinned apps/web to 24.x deliberately, to match the runtime Vercel already
      # provisions (project.nodeVersion = "24.x") and to stop Vercel warning that an
      # open-ended range would auto-upgrade apps/web across a future Node major
      # without an opt-in. Loosening it changes what production is built on.
      #
      # So the two ways out are both the owner's call, not CI's:
      #   * bump this step to node 24, so CI validates the major that is actually
      #     deployed — but then nothing checks the >=22 floor the root still claims;
      #   * or drop the apps/web pin and accept Vercel's auto-upgrade warning again.
      # MEASURED for whoever decides: the strictest node floor among apps/web's own
      # dependencies is starknet@10.0.2 at ">=22" (next@16.2.6 wants ">=20.9.0"),
      # so nothing in the dependency tree requires 24.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` is `turbo run lint`. turbo prints "Running lint in 22 packages"
      # but a package with no `lint` script is silently skipped, so for most of
      # this repo's life that line described 2 packages: apps/extension (eslint)
      # and packages/arcium-sdk (tsc --noEmit). NOTHING that produces or consumes a
      # STARK proof was linted or type-checked here — packages/stark-prover, which
      # holds the shipped WASM prover blob, least of all.
      #
      # MEASURED per package with `tsc --noEmit`, with workspace dependencies built
      # (the raw counts before building deps are all TS2307 "cannot find module
      # @protocol-01/…" against a missing dist/, not real type errors — which is why
      # the lint task now declares `dependsOn: ["^build"]` in turbo.json):
      #   0 errors: stark-prover, privacy-sdk, specter-sdk, zk-sdk, zkspl-sdk,
      #             pay-core, merchant-sdk, auth-sdk, p01-js, privacy-toolkit,
      #             react-native-zk, rpc-config, specter-js, ui, whitelist-sdk,
      #             apps/web, apps/mugen, apps/weekly-update, examples/merchant-netflix
      # All nineteen now carry a `lint` script, so this step covers 21 of 22.
      #
      # NOT covered, deliberately, with the number that makes it a decision:
      #   apps/mobile — 509 errors. 507 of them are `className` (TS2769/TS2322) and
      #     disappear the moment `apps/mobile/nativewind-env.d.ts` exists; that file
      #     is generated, and root .gitignore:183 ignores `**/*.d.ts`, so a fresh CI
      #     checkout never has it. With it present the real count is 2, both
      #     `Type 'Timeout' is not assignable to type 'number'` in
      #     services/sync/realtimeSync.ts. Adding lint here today would be red.
      #   apps/extension — its eslint passes, but `tsc --noEmit` reports 2
      #     (`Property 'env' does not exist on type 'ImportMeta'`, missing
      #     vite/client types), so no type-check was added alongside its eslint.
      #   apps/web eslint — 47 problems (12 errors, 35 warnings). 9 of the 12 are
      #     "Definition for rule … was not found" from eslint-disable comments
      #     naming react-hooks/@next rules its flat config never loads. apps/web
      #     declares eslint ^9.39.4 + eslint-config-next 16.2.6 and invokes
      #     neither; `next lint` no longer exists in Next 16 (not in `next --help`).
      #     Its `lint` script above is the type-check only.
      - name: Lint
        run: pnpm lint

      # THE DEPLOYMENT INTERLOCK. The three WASM gates further down (twins,
      # wireFormat, wasmProbeScan) all compare the blob to THIS TREE and are green
      # whenever the tree agrees with itself. None of them has ever looked at the
      # chain. This step runs BEFORE `turbo run build` on purpose: `apps/web` and
      # `apps/extension` now run the same script in their own build scripts, so
      # without this the job would go red inside a bundler log instead of under a
      # name that says what broke.
      #
      # A client one proof-format generation ahead of the deployed verifier
      # builds fine, serialises fine, uploads all ~78 KB in chunks and then fails
      # on the LAST instruction with FriFoldCheckFailed — which reads as an
      # unexplained transaction failure, not as a version skew.
      #
      # EXPECTED RED, re-measured 2026-08-02: packages/stark-prover/wasm/ holds a
      # B2 prover — measured by DRIVING the blob, 7/7 circuits emit the b2 proof
      # digest, not read off its panic strings — and devnet DGY37k3… still runs
      # pre-B1 bytes (elf sha256 c1a26c17…, slot 469197514, measured off the
      # programdata account, see packages/stark-prover/deployed-verifier.json).
      #
      # This comment said "the B1 prover" and named EXmAQqmk… until 2026-08-02.
      # Both were wrong, in the direction that matters: EXmAQqmk… is a DIFFERENT
      # live devnet program, and a `.so` built from this tree carries
      # `declare_id!(DGY37k3…)`, so it can never execute there — Anchor rejects
      # every instruction with DeclaredProgramIdMismatch. Anchor.toml
      # [programs.devnet] named EXmAQqmk… too, which meant this step's verdict was
      # about a program the shipped SDK never addresses.
      # The ONLY legitimate way to turn it green is to deploy
      # programs/p01_stark_verifier and then re-measure the record with
      # `--measure`. Editing the record instead makes the OFFLINE half green and
      # changes nothing on chain, which is why `--verify-onchain` is passed here:
      # it refetches the programdata account and re-derives the deployed
      # generation from the deployed bytes. A reachable cluster that contradicts
      # the record is a hard failure, and so is an unreachable one whenever
      # nothing else was going to fail the step: a leg that could not reach the
      # chain has established nothing and must not pass on the record's own
      # authority. The chain read is retried three times first, so a single flake
      # does not block a merge.
      #
      # `--cluster devnet` is what makes this a SHIPPING verdict. The cluster is
      # the caller's to name and not the record's; the record's own `cluster`
      # field is cross-checked against this flag and a disagreement fails. Passing
      # `--cluster localnet` here would be refused twice over: it is not a
      # shipping cluster, and CI is not allowed to use the local escape hatch even
      # with P01_ALLOW_LOCAL_VERIFIER_GATE set. Do not set that variable here.
      #
      # The same script runs in `apps/web` build, `apps/extension` build,
      # `apps/mobile` eas-build-post-install and both `prepublishOnly` hooks, so
      # this is not a CI-only gate.
      - name: STARK prover vs DEPLOYED verifier (BLOCKING — proof-format interlock)
        run: node packages/stark-prover/scripts/deployed-verifier-check.mjs --verify-onchain --cluster devnet

      # THE PROGRAM-ID DRIFT GATE. `scripts/sync-program-ids.mjs` exists, works,
      # and until this commit NOTHING CALLED IT. MEASURED 2026-08-03:
      #   grep -rn 'check-program-ids\|sync-program-ids' .github/ package.json \
      #        packages/*/package.json turbo.json
      # returned only the two `package.json` script definitions themselves — no
      # workflow, no prepublish hook, no turbo task. Three separate files
      # (packages/privacy-sdk/src/constants.ts, packages/stark-prover/
      # deployed-verifier.json, packages/stark-prover/scripts/
      # deployed-verifier-check.mjs) cite those commands as the thing that would
      # catch id drift. A declared command nothing runs reads as coverage and is
      # not.
      #
      # It was not wired because a bare `--check` is RED, and would stay red.
      # MEASURED on this tree: exit 1, reported as 10 failures — 9 Anchor.toml
      # `[programs.*]` entries that do not match the crate's own `declare_id!`,
      # plus one aggregate entry carrying 23 hardcoded ids in CODE. Every one
      # of the 32 belongs to a program that is NOT
      # p01_stark_verifier — the fee splitter, the relayer, the stream, the
      # subscription, the whitelist, zkspl, specter, zk_shielded. Each is a real
      # chain-measured defect (see the script header: three of those addresses
      # are CLOSED or nonexistent on devnet), and fixing any of them changes
      # which program a shipped client addresses. That is a product decision.
      #
      # The step below this one already argues, in its own words, that a
      # permanently-red required check gets deleted rather than obeyed. So the
      # wiring is split rather than uniform:
      #
      #   * BLOCKING on p01_stark_verifier, which measures ZERO divergences at
      #     every rule as of this commit — so it can only ever go red for a
      #     reason its owner can fix, and it bites the moment one appears. This
      #     is not a weaker check: `--only` applies R1, R2 and R3 unchanged to
      #     one program's ids, refuses a scope that names no declared program,
      #     and prints how many ids it actually swept so "PASS" can never be a
      #     claim about nothing.
      #   * ADVISORY on the whole repo, running on every push with its true exit
      #     code visible via continue-on-error, so all 32 stay legible instead of
      #     being scoped out of existence.
      #
      # Promote the advisory step to blocking the moment the other lineages'
      # addresses are decided. Do not fold the verifier back into it.
      - name: Program-id drift (BLOCKING — p01_stark_verifier)
        run: node scripts/sync-program-ids.mjs --check --only p01_stark_verifier

      - name: Program-id drift (ADVISORY — whole repo, red by lineage)
        run: |
          set -uo pipefail
          echo "::group::program-id divergences across every program"
          # `rc=0; cmd || rc=$?` and NOT `out="$(cmd)"; rc=$?`. GitHub runs a
          # `run:` block under errexit, and a bare assignment from a failing
          # command substitution kills the shell BEFORE the next line — MEASURED
          # here by executing this step's own body under `bash -e`: it died right
          # after the group header and printed no warning at all. The `||` puts
          # the assignment in a list, where errexit is suspended.
          rc=0
          out="$(node scripts/sync-program-ids.mjs --check 2>&1)" || rc=$?
          printf '%s\n' "$out"
          echo "::endgroup::"
          # The COUNT is the point. An advisory that only says "there is drift"
          # cannot show the number going the wrong way, and this one is expected
          # to stay non-zero for a while — 2026-08-03 it is 10 divergences and 20
          # prose mentions. If that becomes 11 the warning title says 11.
          # No `| head -1` here on purpose: a pipeline that closes early raises
          # SIGPIPE in `sed`, and GitHub runs `run:` under errexit — with
          # pipefail on that combination kills the step and the warning is never
          # printed. Take the first line with parameter expansion instead.
          n="$(printf '%s\n' "$out" | sed -n 's/^\[program-ids\] FAIL — \([0-9][0-9]*\) divergence.*/\1/p')"
          n="${n%%$'\n'*}"
          if [ "$rc" -eq 0 ]; then
            echo "Whole-repo program-id check is GREEN. Promote this step to blocking and delete the scoped one above it."
          elif [ -n "$n" ]; then
            echo "::warning title=Program-id drift: $n divergences::$n program ids diverge from their declare_id! outside p01_stark_verifier, on lineages whose addresses are a product decision. Expanded output is in the group above. Blocking coverage for the verifier is the step before this one."
          else
            # Non-zero exit with no divergence line means the script itself broke
            # — a missing file, a parse error. That is not drift, it is the gate
            # being blind, and it must not read as the known-red case.
            echo "::error title=Program-id check did not run::sync-program-ids.mjs exited $rc without reporting a divergence count. This step measured NOTHING; do not read it as the known 10."
          fi
        continue-on-error: true

      - name: Type check & Build
        run: pnpm turbo run build

      # "17 successful" is 17 turbo tasks, not 17 test suites. MEASURED, two of the
      # seventeen assert nothing and neither is a failure:
      #   @protocol-01/react-native-zk  test = `echo "Tests require React Native
      #     environment"`. No runner is invoked, exit 0. The package contains ZERO
      #     files matching *.{test,spec}.*, so there is nothing for a runner to run
      #     either — the echo is honest about the package, dishonest about the count.
      #   @protocol-01/zkspl-sdk        test = `vitest run --passWithNoTests`, and
      #     vitest reports "No test files found, exiting with code 0". Also zero test
      #     files. `--passWithNoTests` is what keeps it green.
      # Both are green-by-construction and will stay green through any change to
      # either package. Left as they are on purpose: writing tests for the zkSPL
      # client and finding a runner for react-native-zk are pieces of work, not CI
      # edits, and deleting the tasks would only move the gap somewhere less visible.
      # If either package is ever load-bearing for a proof path, that is the moment
      # this stops being acceptable.
      - name: Test
        run: pnpm turbo run test --continue

      # [POOL PARITY] BLOCKING, and it has to be its own step because `pnpm turbo
      # run test` CANNOT see this file. turbo's `test` task runs `vitest run` in
      # apps/web, and `apps/web/vitest.config.ts` sets
      #   include: ['__tests__/**/*.test.ts', '__tests__/**/*.test.tsx']
      # so `lib/privacy/pool/denominatedPool.test.ts` matches nothing. MEASURED:
      # `vitest list --filesOnly` in apps/web returns 20 files and none of them is
      # this one. It runs only under vitest.pool.config.mts (`pnpm test:pool`),
      # and until now nothing in this workflow invoked that.
      #
      # What it covers, in its own config's words: the denominated-pool code was
      # PORTED from the proven extension into apps/web/lib/privacy/pool, and this
      # gate asserts the port stays byte-identical — commitment low-u64 ==
      # the WASM circuit's own output — "so a drift can never silently reach a
      # shielded /pay send". That is a fund-safety property of the /pay send path,
      # and the gate that was supposed to make the drift impossible was wired to
      # nothing while the ported files were under active edit.
      #
      # It needs its own vitest config rather than a wider `include` because the
      # main apps/web suite runs in jsdom with @solana/web3.js mocked for component
      # rendering; this one needs the REAL web3.js in a node environment.
      #
      # MEASURED green when this step was added: 48 passed, 48 total, 2.5s.
      # `run` is spelled out rather than relying on the `pnpm <script>` shorthand:
      # this workflow installs pnpm 10.34.0 while the repo's packageManager field
      # says pnpm@9.15.9, and a gate that silently becomes "Unknown command" is
      # worse than no gate. Both forms were checked on 9.15.9, exit 0.
      - name: Denominated-pool extraction parity (BLOCKING — /pay send drift gate)
        run: pnpm --filter @protocol-01/web run test:pool

      # [PROVER ARTIFACT SKEW] BLOCKING, and separate from `pnpm turbo run test`
      # above because that runs with `--continue` and this must not be advisory.
      #
      # `packages/stark-prover/wasm/p01_stark_bg.wasm` is a git-tracked,
      # npm-published, PREBUILT binary — the prover every client actually runs
      # (extension service worker, mobile WebView, privacy-SDK loader), inlined as
      # base64 into four more tracked files. Nothing in this repo rebuilt any of
      # them: there is no `wasm-pack` step in any package.json or workflow.
      #
      # MEASURED before the Route C reship: the checked-in blob emitted a 79,993-byte
      # circuit-0 proof while the Rust prover at the same commit emitted 45,001 —
      # i.e. the shipped prover predated B4, the domain-separation tags AND Route C,
      # so every client-generated proof was old-format against the on-chain verifier.
      # It fails closed, so that was a functional break of the shipped proving path
      # rather than a soundness hole. Nothing detected it: the only assertion on WASM
      # output anywhere was `expect(proofBytes.length).toBeGreaterThan(1024)`.
      #
      # Three gates, because they catch different failures:
      #   --check         every inlined twin carries the SAME bytes as the
      #                   canonical blob (catches a PARTIAL reship)
      #   wireFormat      the canonical blob's seven proof LENGTHS equal the
      #                   literals `route_c_trace_pair.rs` pins for the Rust
      #                   prover, AND all seven sha256 CONTENT digests match the
      #                   Rust prover (catches a STALE reship — all five copies
      #                   agreeing on the wrong bytes; B1-class skew is
      #                   length-preserving, so the digests are the half that
      #                   catches it). MEASURED negative control: restoring the
      #                   pre-B1 blob 5fe610c9… leaves every LENGTH assertion
      #                   green and turns all seven digests red.
      #   wasmProbeScan   no fails-closed probe identifier (OodForgery,
      #                   AliasedFold, LegacyRowLeaf, …) survives in the blob or
      #                   in any twin. Those knobs are `#[cfg(feature =
      #                   "test-probes")]` in stark/src/compact.rs and the
      #                   feature is off in `default`, so a hit here means the
      #                   blob was built WITH the feature or a new probe landed
      #                   ungated. MEASURED negative control: the pre-gate blob
      #                   f4f2cb09… turns 6 canonical checks and all 4 twin
      #                   checks red.
      #
      # Regenerate with (never add `--features test-probes`):
      #   wasm-pack build stark --target web --out-dir wasm-out -- --features wasm
      #   cp stark/wasm-out/p01_stark_bg.wasm packages/stark-prover/wasm/
      #   cp stark/wasm-out/p01_stark.js      packages/stark-prover/wasm/
      #   node packages/stark-prover/scripts/stark-wasm-twins.mjs --write
      - name: WASM prover artifact skew (BLOCKING — twins + wire-format pin)
        run: |
          node packages/stark-prover/scripts/stark-wasm-twins.mjs --check
          pnpm --filter @protocol-01/stark-prover test

      # Named separately from the step above so a probe leak is legible in the
      # checks list rather than buried in a 50-test vitest run. `vitest run` in
      # the previous step already executes this file; running it again on its own
      # costs ~1s (it is a byte scan, no proof generation) and is what makes the
      # gate merge-blocking BY NAME.
      - name: WASM prover probe leak (BLOCKING — no attack code in the shipped blob)
        run: pnpm --filter @protocol-01/stark-prover exec vitest run src/wasmProbeScan.test.ts

  rust-programs-build:
    name: Rust — Programs cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The SBF toolchain `Anchor.toml:3` pins (`solana_version = "3.1.9"`, which
    # ships platform-tools v1.52). This job used to install agave 2.2.14 instead.
    # See the install step below for why that is not a detail.
    env:
      SOLANA_VERSION: "3.1.9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Needed by the proof-buffer gate step below: those tests build real SBF
      # bytecode with cargo-build-sbf and execute it under litesvm. Without a
      # Solana CLI here the harness panics (by design — it never skips and
      # passes), so this install is part of the gate, not a convenience.
      #
      # [TOOLCHAIN] This installed agave 2.2.14 (platform-tools v1.47) while
      # `Anchor.toml:3` pins 3.1.9 (v1.52). For the accept/reject gates below that
      # is harmless — they assert a decision, and the decision is a property of the
      # program, not of the compiler. For the CU gate it is not: `CU_CEILINGS` pins
      # the COST OF BYTECODE, the same `src/` through two platform-tools is not the
      # same bytecode, and every one of those numbers was measured with 3.1.9. So a
      # red CU step meant either a regression or a compiler difference, nothing said
      # which, and the only thing absorbing the gap was a 2% band.
      #
      # The gap cannot be quantified: on the founder's box 2.2.14 dies with
      # `Failed to install platform-tools: os error 183`, so nobody can measure what
      # it costs. It is therefore removed rather than measured — CI now builds with
      # the same compiler the pins were taken with, and the step below asserts that
      # rather than assuming it.
      - name: Install Solana CLI (Agave) — required by the SBF gate tests
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # `CU_MEASURED_WITH` in tests/cu_budget.rs records the compiler `CU_CEILINGS`
      # was measured with. It is READ OUT OF THE RUST rather than restated here, so
      # the two cannot drift, and an unreadable constant fails this step instead of
      # silently comparing against an empty string.
      #
      # A mismatch is a hard failure on purpose. If this ever fires, the CU numbers
      # downstream would be gated against bytecode from a different platform-tools,
      # and that is precisely the ambiguity this job no longer carries. Fix it by
      # re-measuring and re-pinning CU_CEILINGS, not by deleting this step.
      #
      # `active_release` is a SYMLINK the Solana installer owns, so the thing this
      # step version-checks is not a fixed path. Two consequences, both closed here:
      #   * The symlink is RESOLVED (`readlink -f`) and the concrete versioned path
      #     is what gets checked, so the check names a real binary rather than a
      #     pointer that could be re-aimed after it passed.
      #   * That resolved path is exported to `$GITHUB_ENV` as `P01_CARGO_BUILD_SBF`,
      #     and every later step that builds SBF CONSUMES it instead of re-deriving
      #     `active_release` for itself. Before, three steps each spelled the symlink
      #     path out independently and only this one checked a version — a one-sided
      #     edit to any of the other two reached an unchecked compiler with a green
      #     `test -x`. There is now one source of truth, and the consumers fail
      #     closed if it is unset (i.e. if this step is ever removed) rather than
      #     falling back to whatever `cargo-build-sbf` is on PATH.
      - name: Assert the SBF compiler is the one CU_CEILINGS was measured with
        run: |
          LINK="$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf"
          test -x "$LINK" || { echo "cargo-build-sbf missing at $LINK"; exit 1; }
          SBF="$(readlink -f "$LINK")"
          test -x "$SBF" || { echo "cargo-build-sbf at $LINK resolves to $SBF, which is not executable"; exit 1; }
          echo "active_release resolves to : $SBF"
          got="$("$SBF" --version 2>&1 | tr '\n' ' ' | tr -s ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          want="$(sed -n 's/^const CU_MEASURED_WITH: &str = "\(.*\)";$/\1/p' programs/p01_stark_verifier/tests/cu_budget.rs)"
          echo "cargo-build-sbf --version : $got"
          echo "CU_MEASURED_WITH          : $want"
          if [ -z "$want" ]; then
            echo "::error title=CU_MEASURED_WITH unreadable::could not parse CU_MEASURED_WITH out of programs/p01_stark_verifier/tests/cu_budget.rs — this step cannot compare anything, so it fails rather than passing vacuously"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error title=SBF toolchain drift::CU_CEILINGS was measured with '$want', this runner has '$got'. CU is a property of bytecode, so the CU gate downstream would be red for two possible reasons with no way to tell them apart. Re-measure and re-pin CU_CEILINGS with this compiler, or restore the pinned one."
            exit 1
          fi
          echo "P01_CARGO_BUILD_SBF=$SBF" >> "$GITHUB_ENV"

      - name: Cache Solana platform-tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-platform-tools-${{ env.SOLANA_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # p01-arcium is excluded because its Arcium macros
      # (init_computation_definition_accounts, queue_computation_accounts,
      # callback_accounts, arcium_callback) read .arcis bytecode files from
      # programs/p01_arcium/build/ at proc-macro expansion time. Those files
      # are produced by `arcium build` (Arcium CLI / Arcis compiler), not by
      # cargo, and are gitignored. CI does not have the Arcium toolchain.
      # Local devs run `arcium build` once, then `cargo check` works there.
      - name: cargo check (workspace, excl. p01-arcium)
        run: cargo check --workspace --all-targets --exclude p01-arcium --exclude encrypted-ixs

      # This is a real gate, not a formality. `eval_periodic_stride_at_z` and
      # `eval_periodic_ext_at_z` in the verifier perform NO runtime validation
      # by design — a sparsity scan would cost exactly what the rewrite saves —
      # so `tests/periodic_stride.rs` IS the entire safety argument for the A3
      # and A4 periodic-column rewrites. It re-derives every constant from the
      # dense tables in `periodic_consts.rs` and fails if a rebake was not
      # mirrored. `cargo check --all-targets` COMPILES these tests but never
      # runs them, so until this step existed the pin was never executed.
      #
      # Release mode is required: the older `eval_periodic_stride16_at_z` hides
      # its sparsity check behind `#[cfg(debug_assertions)]`, so a debug-only
      # run would not exercise the profile that actually ships.
      #
      # [B4] `tests/b4_pair_leaf.rs` is the fails-closed guard for the pair-leaf
      # Merkle commitment. The pair index, the order of the two halves inside a
      # leaf, and the path depth are agreed between prover and verifier but
      # never travel on the wire, so nothing else catches a drift. That test
      # runs the prover under three deliberately different pair layouts and
      # asserts the verifier rejects each with MerkleProofFailed. If it is not
      # executed, a silent prover/verifier disagreement is possible.
      # [DOMAIN SEP] `tests/merkle_domain_sep.rs` is the fails-closed guard for
      # Merkle leaf/node domain separation. Untagged, `leaf = SHA256(preimage)`
      # and `node = SHA256(l ‖ r)` were the SAME function, so a genuine internal
      # node could be re-presented as a leaf whose preimage is that node's own
      # two children, with the node's real siblings as the path — and the walk
      # landed on the real root. Nothing else in the suite catches that: every
      # other test opens leaves the prover actually built, so it never asks the
      # question. The test also pins the prover's tags against the verifier's;
      # the two crates declare them independently and a one-sided edit breaks
      # every honest proof.
      # [ROUTE C] `tests/route_c_trace_pair.rs` is the fails-closed guard for the
      # pair-leaf TRACE commitment. Two things need guarding that nothing else
      # covers:
      #   1. The version-skew seam. Prover and verifier must agree on the pair
      #      index, which row is the low half, the path depth, and the fact that
      #      the tree is pair-leafed at all — none of which travel on the wire. At
      #      trace_width == 4 (C2, C4) the old and new wire formats are the SAME
      #      NUMBER OF BYTES, so every length check passes and the Merkle check is
      #      the only thing that rejects an old-format proof. Measured: with the
      #      trace openings removed, an old-format C4 proof gets all the way to
      #      TransitionConstraintFailed.
      #   2. The mirror rows. Route C puts two extra trace rows per query on the
      #      wire. They are authenticated and — in this revision — never read, so
      #      no other test would notice if they stopped being bound to trace_root.
      # It also pins the C0 gate: circuit 0 must be refused by name on the generic
      # dispatch, because the generic path cannot verify an honest C0 proof
      # (measured: DeepAliFailed) while four shipped instructions require id 0.
      #
      # `route_c_trace_pair::all_four_trace_authentication_call_sites_are_present`
      # is the pre-land assertion. MEASURED during the round-3 review: a concurrent
      # process deleted ALL FOUR `verify_merkle_path_2seg` blocks from verify.rs —
      # both in `verify_merkle_proofs_generic` and both in the legacy C0 path — and
      # `git status` read ` M verify.rs` before and after, identically. That test
      # counts the call sites in the source on disk and names the missing surface,
      # so a half-restored tree cannot be landed by someone who sees green elsewhere.
      - name: cargo test (verifier — the periodic-column, field, pair-leaf, domain-sep and Route-C pins)
        run: |
          cargo test -p p01_stark_verifier --lib
          cargo test -p p01_stark_verifier --release --test periodic_stride
          # [A4 PROVENANCE] Not a second pin — say so out loud. Every assertion
          # `a4_probe` makes is implied by `periodic_stride` above, and strictly:
          # it asserts `gcd >= 16` where periodic_stride asserts stride-16
          # sparsity at every index; it recomputes the deviation support where
          # periodic_stride asserts that support IS rows 480..=511; it never
          # reads the baked `*_PERIODIC16` / `*_TAIL` at all. It runs here for
          # two reasons: `tests/a4_probe.rs` also carries `a4_emit_consts`, the
          # `--ignored` generator that `src/periodic_ext_consts.rs:25` names as
          # the provenance of a checked-in source file, and a `#[test]` that no
          # workflow executes reads as coverage while being none. `--nocapture`
          # because the printed table IS the deliverable: per-column gcd,
          # non-zero counts, deviation support and the identity verdict at 1,000
          # random z. MEASURED: 0.24s.
          cargo test -p p01_stark_verifier --release --test a4_probe -- --nocapture
          cargo test -p p01_stark_verifier --release --test fri_end_to_end
          cargo test -p p01_stark_verifier --release --test b4_pair_leaf
          cargo test -p p01_stark_verifier --release --test merkle_domain_sep
          cargo test -p p01_stark_verifier --release --test route_c_trace_pair
          # [B1] The coordinated-forgery suite. Listing it here is what makes it a
          # gate: unfiltered `cargo test -p p01_stark_verifier` is never what CI
          # runs — this list IS the coverage, so a test file that is not named
          # above executes nowhere — and anchor-test.yml runs no
          # p01_stark_verifier suite at all, so ci.yml is the only place it lands.
          # It is the ONLY test in the repo that distinguishes a working DEEP
          # binding from a broken one — the twelve existing tampered-OOD tests
          # pass against a verifier with no binding whatsoever, because a byte
          # patch desynchronises the grinding transcript before FRI is reached.
          cargo test -p p01_stark_verifier --release --test b1_deep_binding
          # [DRIFT] The seven below were in `tests/` and named nowhere in this file,
          # so by the contract stated four lines up they executed nowhere — while
          # reading, to anyone opening the directory, as covered. That is the B2
          # soundness measurement, the B2 per-segment gamma binding, both C5/C6
          # liveness probes, and `liveness_generator_semantics`, the guard whose
          # own commit exists to prove the witness generators honest before their
          # 1120/0 is quoted. MEASURED on this box, release, all seven green:
          # 17.5s / 11.2s / 24.2s / 89.7s / 374.1s / 15.6s for the first six.
          # `honest_liveness` at just over six minutes is the only one that costs
          # anything, and it is the run that produces the 1120/0 figure, so it is
          # also the one least worth taking on trust.
          #
          # Adding names to a hand-maintained list does not stop it drifting again,
          # so `cu_budget.rs::every_verifier_integration_test_target_is_named_in_ci`
          # now reads `tests/` off disk and fails when a target is not named here.
          # Add the `--test` line when you add the file, or record the exclusion in
          # `CI_UNRUN_TEST_TARGETS` with a reason.
          cargo test -p p01_stark_verifier --release --test b2_bits_measured
          cargo test -p p01_stark_verifier --release --test b2_segment_binding
          cargo test -p p01_stark_verifier --release --test c5_conservation_probe
          cargo test -p p01_stark_verifier --release --test c6_padding_rows
          cargo test -p p01_stark_verifier --release --test honest_liveness
          cargo test -p p01_stark_verifier --release --test liveness_fix_attack
          cargo test -p p01_stark_verifier --release --test liveness_generator_semantics
          # [MERGE 2026-08-03] The three below arrived on the other STARK lineage
          # in the same window the drift gate above was written on this one, so
          # the first thing the merge produced was
          # `every_verifier_integration_test_target_is_named_in_ci` going RED with
          # three unnamed targets. That is the gate working, not a merge problem:
          # cross_circuit_confusion (what actually separates the six circuits, and
          # the caller-chosen public input that could switch boundary constraints
          # off), phase_binding_seam (the phase-1/phase-2 binding), and wire_parity
          # (the two crates' wire geometry, driven rather than read). Naming them
          # here is the whole fix; nothing was excused into CI_UNRUN_TEST_TARGETS.
          cargo test -p p01_stark_verifier --release --test cross_circuit_confusion
          cargo test -p p01_stark_verifier --release --test phase_binding_seam
          cargo test -p p01_stark_verifier --release --test wire_parity
          cargo test -p p01_stark_verifier --release --test b7_coset_shift_pairing
          cargo test -p p01_stark_verifier --release --test ood_column_probe

      # [PROVER] The prover half of every pin above, plus the LDE coset sequencing
      # companion (`compact::lde_coset_sequencing::lde_has_no_coset_offset_measured_today`).
      # That test is GREEN today and goes RED the moment an LDE coset offset lands —
      # deliberately, so the coset fix cannot be landed without touching the tripwire
      # it unblocks. `aligned_hits_is_zero_once_the_domain_is_shifted` is its positive
      # control, so `hits == checked` cannot be a predicate that is simply always true.
      - name: cargo test (prover — p01-stark lib pins incl. the LDE coset companion)
        run: cargo test -p p01-stark --lib --release

      # [SEQUENCING] Route C's mirror rows are authenticated and NEVER READ in this
      # revision (probed: 1,296 single-bit flips on C1 produced exactly one outcome,
      # MerkleProofFailed — no constraint/DEEP/FRI step reads them). So on its own
      # Route C buys +704/+1,056/+2,112 bytes on the three largest circuits and a 2x
      # amplification of the LIVE raw-witness leak, with the soundness benefit arriving
      # only when step 4's H recomputation consumes those rows.
      #
      # This step prints the verdict and does NOT fail the job. The tripwire test is
      # RED when run, by design, and a permanently-red required step gets deleted
      # rather than obeyed (see the clippy --all-targets note above for the same
      # failure mode). The MECHANICAL enforcement is the companion test in the
      # blocking step above, which goes red when the coset fix lands.
      #
      # Two ways to clear it: land the LDE coset offset, or hold the Route C wire
      # change until step 4 ships with it.
      - name: LDE coset sequencing tripwire (ADVISORY — RED BY DESIGN until the coset fix)
        run: |
          echo "::group::LDE coset sequencing verdict"
          cargo test -p p01-stark --lib --release lde_coset_sequencing -- --ignored --nocapture \
            || echo "::warning title=Route C sequencing::LDE has no coset offset — Route C must NOT reach a deployed verifier. Land the coset offset, or hold the Route C wire change until step 4."
          echo "::endgroup::"
        continue-on-error: true

      # STARK verification of circuits 1-6 is two instructions:
      #   verify_stark_proof_v2   -> ProofBuffer.verified          (byte 49)
      #   verify_deep_ali_phase2  -> ProofBuffer.deep_ali_verified (byte 82)
      # Phase 1 alone is not an AIR check — `verify_quotient_at_query` enforces
      # nothing and boundary constraints fire only on a query that is both
      # trace-aligned and on an assertion row — so a consumer gating on byte 49
      # alone accepts a proof whose declared public inputs are bound to nothing.
      # p01_liquidity::prefund and every p01_zkspl proof consumer did exactly
      # that, and both were demonstrated paying out under litesvm on a
      # hand-built phase-1-only buffer.
      #
      # `--lib` pins the byte LAYOUTS the gates read (min length 83, flag at 82,
      # inputs-hash slice stopping before it, DenominatedPool field offsets).
      # It does NOT execute a single `require!`: measured during review, both
      # `require!(deep_ali_verified, ..)` lines were deleted and `--lib` stayed
      # green on both crates. So it runs here as a layout pin and nothing more.
      #
      # `--test deep_ali_gate` is the actual gate. Each harness compiles the
      # crate to real SBF bytecode (its own --sbf-out-dir + CARGO_TARGET_DIR,
      # cached on a content fingerprint of src/, so it can never be a gate on
      # stale bytes in target/deploy/) and asserts the accept/reject decision a
      # validator would make. A missing build tool panics with the compiler
      # output; it never skips and passes.
      #
      # Covered: the DEEP-ALI gate on prefund/withdraw/prove_balance; prefund's
      # payout binding (`amount == denomination`), its pool allowlist
      # (`denominated_pool.authority == pool.admin`, since zk_shielded pool
      # creation is permissionless and the denomination is otherwise
      # attacker-chosen), its replay bound (PrefundRecord keyed on the proven
      # `nullifier[..8]`), and the `init_pool` kill switch. Each file carries
      # positive controls, so "reject everything" cannot make this step green.
      - name: cargo test (proof-buffer gate — layout pins, no require! executed)
        run: |
          cargo test -p p01_liquidity --lib
          cargo test -p p01_zkspl --lib

      # P01_CARGO_BUILD_SBF comes from the assert step above, already resolved
      # past `active_release` and already version-checked against
      # CU_MEASURED_WITH. It is NOT re-derived here: a second spelling of the
      # symlink path is a second place to drift, and the harness's PATH fallback
      # means a silent fallback to a different tool is the kind of thing that
      # turns a gate into a coin flip. Unset means the assert step is gone, so
      # this fails rather than reaching an unchecked compiler.
      #
      # These two moved from 2.2.14 to 3.1.9 as a side effect of the install pin
      # above. They assert an accept/reject decision rather than a cost, so the
      # compiler is not load-bearing here — but it still has to compile them.
      # MEASURED before the pin was changed, with the 3.1.9 cargo-build-sbf and a
      # CARGO_TARGET_DIR that did not exist: p01_liquidity exit 0, 328,344 B .so;
      # p01_zkspl exit 0, 344,552 B .so.
      - name: cargo test (proof-buffer + payout gates, real SBF bytecode under litesvm)
        run: |
          test -n "$P01_CARGO_BUILD_SBF" || { echo "::error title=SBF compiler not asserted::P01_CARGO_BUILD_SBF is unset, so the step that version-checks the SBF compiler against CU_MEASURED_WITH did not run. Restore it — do not re-derive the path here."; exit 1; }
          test -x "$P01_CARGO_BUILD_SBF" || { echo "cargo-build-sbf missing at $P01_CARGO_BUILD_SBF"; exit 1; }
          cargo test -p p01_liquidity --test deep_ali_gate -- --nocapture
          cargo test -p p01_zkspl     --test deep_ali_gate -- --nocapture

      # [CU] `tests/cu_budget.rs` is the ONLY thing in this repo that measures compute
      # units or proof bytes against real SBF bytecode, and until this step existed it
      # appeared in no workflow — so the 1,400,000 CU ceiling was never checked
      # automatically and Route C's +2,112 B / +3 chunks on C6 was caught by nothing.
      #
      # Two round-3 fixes make it a gate rather than a table:
      #   * It BUILDS the .so it measures (its own --sbf-out-dir + CARGO_TARGET_DIR,
      #     cached on a content fingerprint of src/), so there is no path by which it
      #     reports CU for bytes that predate the change under test. The old behaviour
      #     was a `println!` warning, and MEASURED: a green run on stale bytes happened
      #     during this very step's development.
      #     That fingerprint now covers the COMPILER too (`cargo-build-sbf --version`,
      #     which reports the platform-tools version with it). It did not, and MEASURED
      #     on the source-only key: with target/cu-budget holding a 3.1.9 build, re-running
      #     with P01_CARGO_BUILD_SBF pointed at agave 2.2.14 printed `cache hit` and
      #     re-reported the 3.1.9 numbers under an unchanged .so sha256. Back then this
      #     step exported P01_CARGO_BUILD_SBF=active_release with 2.2.14 installed while
      #     Anchor.toml:3 pinned 3.1.9, so CI and a local run were one env var apart and
      #     the trap was live. `build_fingerprint_changes_when_the_compiler_changes` is
      #     the pin, and it is a pin on the CACHE KEY, not on which compiler CI picks —
      #     it makes a switch visible, it never made the two equal.
      #     RE-MEASURED end to end when this step was pinned, on the same trap: with
      #     target/cu-budget holding the valid 3.1.9 build under fingerprint
      #     28cc268b11fd8b8a, re-running with P01_CARGO_BUILD_SBF pointed at 2.2.14
      #     printed `build fingerprint 2dd5590bccda83a2 — rebuilding`, not `cache hit`,
      #     and then panicked (exit 101) on 2.2.14's own platform-tools install. So the
      #     compiler is still genuinely in the key, and the harness still fails closed.
      #     What makes them equal is the install step above: this job now installs the
      #     3.1.9 Anchor.toml pins, and `Assert the SBF compiler is the one CU_CEILINGS
      #     was measured with` fails the job before this step runs if it is ever not.
      #     Belt and braces, because a CI file is easy to edit: `toolchain_caveat` in
      #     the harness compares the live compiler against CU_MEASURED_WITH and, on a
      #     mismatch, prints the gap above the ceiling table AND inside every violation.
      #     So a red here is a regression, and on the day it is not, it says so itself.
      #   * `CU_CEILINGS` pins phase-1 and phase-2 CU per circuit at measured*1.02.
      #     Before that, nothing bounded CU from above except the 1,400,000 cap, so C0's
      #     599,059 could have become 1,399,000 and stayed green.
      #     `cu_ceiling_check_rejects_a_regression_and_accepts_the_recorded_numbers`
      #     carries the positive and negative controls, so "reject nothing" cannot make
      #     this step green.
      #
      # The harness now asserts the OTHER ceiling as well. Every proof is padded to
      # UNIFORM_PROOF_SIZE (145,000 B) before upload so the buffer length leaks nothing
      # about which circuit ran, and a proof over that cannot be padded to it. Nothing
      # in Rust checked: `145_000` appeared in no .rs file, cu_budget carried proof_bytes
      # on every row and only PRINTED it, and the sole enforcement anywhere was a runtime
      # `throw` in padProofToUniform on a user's phone, after proving. Largest today is
      # C4 at 81,457 B post-B2 (it was C6 at 78,517 B before the quotient split);
      # docs/C7_SPEND_CIRCUIT_PLAN.md:15 already projects ~160 KB for C7, which is
      # 15,000 B over. The Rust constant is parsed out of
      # apps/mobile/services/stark/index.ts so the two languages cannot drift.
      #
      # --release is not optional: the harness generates eleven real STARK proofs.
      #
      # [FILTER DRIFT 2026-08-03] This step used to pass an INCLUSION list of six
      # positional name filters, and libtest silently ignores a test that matches
      # none of them. MEASURED on the merge of the two STARK lineages: two tests
      # matched no filter and executed nowhere —
      # `every_verifier_integration_test_target_is_named_in_ci`, which is the gate
      # whose whole subject is "a test named nowhere in ci.yml runs nowhere", and
      # `harness_serialises_its_own_sbf_builds`, the assertion that the SBF tool
      # lock is real. Both were green when finally run; that is the point, since
      # nothing was broken, nothing complained, and the coverage was absent anyway.
      # A name list guarding a name list has the same standing to drift as the
      # `--test` list above, so this is an EXCLUSION now: everything in the file
      # runs, one test is skipped by name, and a new test is covered by default.
      # `cu_budget.rs::every_cu_budget_test_is_reachable_from_the_ci_filter` parses
      # this invocation and fails on any test it would not select.
      #
      # `cu_budget_c7_phase2_probe` is the one exclusion — its throwaway probe
      # program is gitignored, and a missing artifact is a panic by design, so it
      # cannot run here. The reason is carried in CI_UNRUN_CU_BUDGET_TESTS too.
      #
      # `--test-threads=1` is belt and braces: the harness serialises its own
      # cargo-build-sbf spawns now, and `harness_serialises_its_own_sbf_builds`
      # is the assertion that it does — which is precisely one of the two tests
      # that could not run under the old filter list.
      - name: cargo test (CU budget — measured CU + proof bytes, self-built SBF bytecode)
        run: |
          test -n "$P01_CARGO_BUILD_SBF" || { echo "::error title=SBF compiler not asserted::P01_CARGO_BUILD_SBF is unset, so the step that version-checks the SBF compiler against CU_MEASURED_WITH did not run. Restore it — do not re-derive the path here."; exit 1; }
          test -x "$P01_CARGO_BUILD_SBF" || { echo "cargo-build-sbf missing at $P01_CARGO_BUILD_SBF"; exit 1; }
          cargo test -p p01_stark_verifier --release --test cu_budget \
            -- --nocapture --test-threads=1 \
            --skip cu_budget_c7_phase2_probe

      # [ROUTE C] `p01_stark_verifier` is split out and BLOCKING. It was under the
      # shared `continue-on-error: true` below, which made every warning on it
      # advisory — including the unused-variable warning a PARTIAL deletion of the
      # trace-commitment check leaves behind.
      #
      # READ THE SCOPE OF THAT PRECISELY. This step reacts to a partial deletion
      # and to NOTHING ELSE about the trace commitment. Re-MEASURED on this tree,
      # both mutations run and reverted:
      #   * all four `verify_merkle_path_2seg` blocks removed, their
      #     `let (lo, hi)` / `let (nlo, nhi)` locals LEFT in place
      #       -> cargo clippy -p p01_stark_verifier -- -D warnings : exit 101,
      #          8 `unused variable` errors. Caught.
      #   * the same four blocks removed TOGETHER with those locals and the
      #     `let next_pos = …` they fed — a clean deletion, nothing orphaned
      #       -> cargo clippy -p p01_stark_verifier -- -D warnings : exit 0.
      #          SILENT, with the entire trace-commitment check gone.
      # It cannot be otherwise: `src/lib.rs:1` carries crate-wide
      # `#![allow(unknown_lints, dead_code, unused_imports)]`, and
      # `merkle::verify_merkle_path_2seg` is a `pub fn` in a `pub mod`, so a
      # zero-call-site version of it is not dead code by any lint's definition.
      #
      # The gate on the clean deletion is
      # `route_c_trace_pair::all_four_trace_authentication_call_sites_are_present`
      # in the blocking cargo test step above, and that is VERIFIED, not assumed:
      # under the clean-deletion mutation `cargo test -p p01_stark_verifier
      # --release --test route_c_trace_pair` went 15 passed / 7 FAILED, that test
      # among them, naming `contains 0 call sites, expected 4`. Do not let this
      # step's name talk anyone out of running that one.
      #
      # MEASURED here, on the tree this comment ships with:
      #   cargo clippy -p p01_stark_verifier -- -D warnings           -> exit 0
      # so this step stays exactly as it is: every lint, no exceptions, on the
      # crate that actually ships on chain. The `--all-targets` widening the old
      # comment argued against is now a SEPARATE step below rather than a
      # widening of this one, so a style regression in a test can never be
      # confused with a lint regression in `src/`.
      - name: cargo clippy (BLOCKING — verifier src, every lint)
        run: cargo clippy -p p01_stark_verifier -- -D warnings

      # [2026-08-03] THE TEST CODE WAS NOT LINT-GATED, AND THE TEST CODE IS WHERE
      # EVERY GATE IN THIS PACKAGE LIVES.
      #
      # The step above is `-p p01_stark_verifier` with no `--all-targets`, so it
      # compiles `src/` and nothing else. Its own comment is the reason this
      # matters: it documents that clippy caught a PARTIAL deletion of the
      # trace-commitment check through the `unused variable` locals it left
      # behind. That instrument was pointed at `src/` only, while the thing a
      # mutation has to get past is `tests/`.
      #
      # The obvious widening does not work, and the old comment's numbers were
      # both stale and misattributed. RE-MEASURED on this tree:
      #   cargo clippy -p p01_stark_verifier --all-targets -- -D warnings
      #     -> exit 101, 102 errors (not 105), and ALL 102 are in `stark/src/`.
      #        It aborts on the dev-dependency `p01-stark` lib and NEVER REACHES
      #        a single one of the verifier's own test targets. So `--all-targets`
      #        was not "the same gate, wider" — it was a gate that could not get
      #        far enough to look at what it was being asked to look at.
      # A JSON sweep of both packages with no `-D` (warnings do not abort, so the
      # whole graph compiles) found 144 unique (lint, file, line):
      #   120  stark/src/            the prover lib
      #    22  programs/p01_stark_verifier/tests/
      #     2  programs/p01_stark_verifier/src/   (cfg(test)-only, invisible above)
      # Those 24 had never been reported by any gate in this repo.
      #
      # WHAT THIS STEP DENIES, AND WHY IT IS A POSITIVE CHOICE AND NOT AN ESCAPE
      # `-D warnings` keeps every rustc lint at deny — `unused_variables`,
      # `unused_mut`, `unreachable_code`, `unused_imports`, `unused_must_use`.
      # That is precisely the class that catches a partial deletion, and it is
      # now enforced over `tests/` for the first time. `clippy::correctness`,
      # `clippy::suspicious` and `clippy::perf` stay denied with it.
      # `clippy::style`, `clippy::complexity`, `clippy::pedantic` and
      # `clippy::nursery` are allowed here because a `for i in 0..n { x[i] }`
      # cannot hide a deleted check, and holding a soundness gate hostage to 136
      # formatting opinions is how the widening got reverted the first time.
      #
      # THE RESIDUE, COUNTED, so this is a decision and not a silence. MEASURED:
      #   cargo clippy -p p01_stark_verifier --all-targets -- -D warnings
      #     -> exit 101, 138 unique findings, ALL in the allowed groups except 2:
      #        (115 stark/src, 21 verifier tests, 2 verifier src)
      #        53  clippy::assign_op_pattern        `a = a + b` in AIR/prover math
      #        45  clippy::needless_range_loop      indexed loops in AIR/prover math
      #        12  clippy::useless_conversion
      #         7  clippy::manual_is_multiple_of
      #         6  clippy::too_many_arguments       prover entry points, 8..13 args
      #         4  clippy::unnecessary_cast
      #         3  clippy::manual_repeat_n
      #         2  clippy::manual_range_contains
      #         1  each: print_literal, items_after_test_module,
      #               unnecessary_map_or, assertions_on_constants
      #         2  dead_code  <- NOT noise; pinned by the step below, exactly
      # The 98 `assign_op_pattern` + `needless_range_loop` hits are in
      # `stark/src/air/*` and `stark/src/compact.rs`, i.e. the constraint
      # evaluators and the LDE/quotient loops. `clippy --fix` would rewrite them
      # mechanically; on THIS code that is a soundness-relevant edit and it needs
      # its own branch, its own mutation testing and its own reviewer, not a
      # drive-by inside a CI-wiring change. Honest estimate for that job: several
      # hours, dominated by re-proving the seven circuits after the rewrite.
      # `too_many_arguments` is a signature change reaching the WASM prover and
      # every test; it is not fixable here at all.
      #
      # Six findings WERE fixed rather than allowed, because each was real:
      # `stark/src/compact.rs:1` and `stark/src/bin/gen_proof.rs:1` used `///`
      # for module docs with a blank line after, so ten lines of documentation
      # attached to nothing and rustdoc never showed them (`//!` now); three
      # unused `winterfell::math::StarkField` imports in `stark/src/poseidon/
      # mod.rs`; and `vec_init_then_push` in `tests/cu_budget.rs`.
      #
      # THIS STEP WAS PROVEN TO BITE, not assumed to. Mutation run and reverted
      # on this tree: one orphan local added to
      # `tests/phase_binding_seam.rs:82` — the residue a PARTIAL deletion of a
      # check leaves behind, which is the exact shape the step above is
      # documented as having caught in `src/`.
      #   cargo clippy -p p01_stark_verifier -- -D warnings             -> exit 0. SILENT.
      #   cargo clippy -p p01_stark_verifier --all-targets -- (this step)
      #     -> exit 101, `unused variable: mutation_probe_orphan_local`,
      #        named to the file and line.
      # The narrow step cannot see it. That is the whole reason this one exists.
      #
      # `-A dead_code` is the one single-lint exception and it is NOT a silence:
      # the step immediately after this re-runs clippy at its DEFAULT levels,
      # SELECTS the dead_code findings out of the JSON by lint code, and fails
      # unless that set is EXACTLY the two named there — so the exception costs a
      # pin rather than buying a blind spot.
      - name: cargo clippy (BLOCKING — verifier tests + prover, correctness lints)
        run: |
          cargo clippy -p p01_stark_verifier --all-targets -- \
            -D warnings -A dead_code \
            -A clippy::style -A clippy::complexity -A clippy::pedantic -A clippy::nursery

      # `dead_code` is the ONE lint held out of the blocking step above that is
      # not noise, so it is reported here every run rather than hidden behind an
      # `-A` nobody reads. Two findings, both MEASURED 2026-08-03, both in
      # `stark/src/compact.rs`, and neither is fixable without a decision:
      #
      #   :5724  `FriCommitData.alphas` is never read outside `#[cfg(test)]`.
      #          Its only reader is `test_fri_commit_layer_count_matches_domain_shrink`,
      #          which is the sole assertion in the tree that the number of FRI
      #          folds matches the domain shrink. Deleting the field to satisfy
      #          the lint would delete that pin, which is a weakening.
      #   :6308  `QuotientSpec::LegacyGeneric` is never CONSTRUCTED, anywhere,
      #          including tests — while two `match` arms still handle it
      #          (`solve_ood_quotient_for_spec` returns None, and the quotient
      #          builder has a whole pointwise-LDE branch for it). Its own doc
      #          says "will be deleted once all are migrated" and C1..C6 all have
      #          their dedicated variants now, so the branch is unreachable
      #          prover code. Deleting it cascades into
      #          `compute_quotient_at_position_generic`, its only caller, which
      #          two verifier source comments still reference. That is a prover
      #          change, not a lint fix.
      #
      # SO THIS STEP IS BLOCKING AND PINS THE SET, rather than being an advisory
      # nobody reads. It passes iff the dead_code findings are EXACTLY those two
      # and nothing else. A third one — a field a partial deletion orphaned, an
      # enum arm a refactor stranded — turns it red and names itself. So does an
      # `#[allow(dead_code)]` slapped on either of the two, because that REMOVES
      # a line from the expected set and the comparison is an equality, not a
      # ceiling. That is the property an `-A dead_code` alone cannot have.
      #
      # Two details that are load-bearing and not stylistic:
      #   * clippy runs at its DEFAULT lint levels — no `-A`, no `-D`. dead_code
      #     is a warning there, so nothing aborts and every target gets checked.
      #     Both obvious alternatives were tried and MEASURED on 2026-08-03 and
      #     both are wrong: `-A warnings -D dead_code` reports correctly but
      #     ABORTS at `p01-stark` and never reaches the verifier's own targets
      #     (the same trap `--all-targets` fell into above), and
      #     `-A warnings -W dead_code` compiles everything and reports NOTHING,
      #     because `warnings` is a pseudo-group rustc applies over the
      #     individual specifications. A gate built on that second pair looks
      #     reasonable and measures nothing at all.
      #   * selection is on the LINT CODE, via `scripts/dead-code-set.mjs`, not
      #     on rendered text and not on line numbers. Line numbers in
      #     `stark/src/compact.rs` move under every prover branch; rustc's
      #     wording changes on its own (it switches to "fields `a` and `b` are
      #     never read" when there are two). Both make a pin that quietly stops
      #     matching, which is the failure this pass exists to remove.
      #     That script exits 2 rather than printing an empty set when it is
      #     handed no JSON at all, so "no findings" can never be produced by the
      #     gate having failed to run.
      - name: cargo clippy (BLOCKING — dead_code pinned to exactly the 2 named findings)
        run: |
          set -uo pipefail
          # This job has no actions/setup-node — it relies on the node the
          # ubuntu-latest image ships. Say so out loud rather than letting the
          # gate die on `node: command not found` and read as a lint verdict.
          command -v node >/dev/null || { echo "::error title=node missing::this step needs node to classify clippy output and the runner has none; add actions/setup-node to the rust-programs-build job"; exit 1; }
          echo "::group::dead_code across p01_stark_verifier + p01-stark, all targets"
          rc=0
          cargo clippy -p p01_stark_verifier --all-targets --message-format=json \
            > /tmp/clippy-dead-code.json 2> /tmp/clippy-dead-code.err || rc=$?
          cat /tmp/clippy-dead-code.err
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=clippy did not run::cargo clippy exited $rc before a finding set could be read. That is a build failure, not a dead_code verdict — fix the build, do not touch the pin."
            exit 1
          fi
          got="$(node scripts/dead-code-set.mjs < /tmp/clippy-dead-code.json)" || {
            echo "::error title=dead_code set unreadable::scripts/dead-code-set.mjs refused the clippy output; its reason is on stderr above. This step measured NOTHING and must not be read as green or as drift."
            exit 1
          }
          want="$(printf '%s\n%s' 'stark/src/compact.rs :: field `alphas` is never read' 'stark/src/compact.rs :: variant `LegacyGeneric` is never constructed')"
          if [ "$got" = "$want" ]; then
            echo "dead_code: exactly the two findings ci.yml names above, and no others."
            exit 0
          fi
          echo "::error title=dead_code set changed::The dead_code findings are no longer exactly the two documented in .github/workflows/ci.yml. A NEW one is unreachable code somebody just created — read it, do not allow it. A MISSING one means it was deleted or silenced: deleting FriCommitData.alphas deletes the only pin that FRI fold count matches domain shrink, and an #[allow] is not a fix. Update the pin in this step only together with the paragraph above it."
          echo "--- expected ---"; printf '%s\n' "$want"
          echo "--- got ---";      printf '%s\n' "$got"
          exit 1

      # `p01_relayer` was advisory on the grounds that it "still carries
      # pre-existing warnings that nobody has triaged". It does not, and had not
      # for some time. MEASURED on this tree, after `cargo clean -p p01_relayer`:
      #   cargo clippy -p p01_relayer -- -D warnings   -> exit 0, zero findings
      # so it is promoted. Separate step, separate name: a red here is a relayer
      # regression, and it should not read as a verifier one.
      #
      # Two honest caveats, so this comment does not overstate its own gate the
      # way the one it replaced did:
      #   * exit 0 is against `src/lib.rs:1-22`, which allows ~20 clippy lints
      #     crate-wide (`too_many_arguments`, `needless_range_loop`, …). That
      #     list is pre-existing and untouched here; the gate is "no NEW finding
      #     outside it", not "clippy-clean".
      #   * measured with clippy 0.1.95 / rustc 1.95.0. CI takes
      #     `dtolnay/rust-toolchain@stable`, so a later stable that adds a lint
      #     can turn this red without a source change. That is the same exposure
      #     the verifier step above already carries. If it fires, triage the
      #     finding — do not restore `continue-on-error`.
      - name: cargo clippy (BLOCKING — relayer)
        run: cargo clippy -p p01_relayer -- -D warnings

      # `zk_shielded` stays advisory, and it is the ONLY one that still needs to
      # be. MEASURED on this tree, after `cargo clean -p zk_shielded`:
      #   cargo clippy -p zk_shielded -- -D warnings   -> exit 101, 3 findings
      # all three in `programs/zk_shielded/src/compliance.rs`: the unused import
      # `crate::errors::ZkShieldedError` (line 3) and the never-used constants
      # `MAX_EXPIRES_IN_SECONDS` (17) and `MIN_EXPIRES_IN_SECONDS` (20). Triage
      # those three and this step can be promoted too. Do not fold the verifier
      # or the relayer back in here.
      - name: cargo clippy (advisory — zk_shielded)
        run: cargo clippy -p zk_shielded -- -D warnings
        continue-on-error: true
