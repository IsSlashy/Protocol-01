name: CI

on:
  # ⛔ MASTER-ONLY IS HOW A BROKEN BUILD LIVED FOR A DAY.
  #
  # `6333aa00` (2026-08-25 20:56) made apps/web import
  # @protocol-01/stark-prover/wasm-loader instead of carrying its own ABI copy.
  # That package's dist/ is gitignored and apps/web's build script hand-lists
  # the workspace packages it pre-builds — stark-prover was not on the list. The
  # app stopped building. `pnpm turbo run build` below would have caught it on
  # the first push, because turbo.json declares dependsOn: ["^build"] — but this
  # workflow only ran on master, the work was on a feature branch, and nobody
  # looked at Vercel. Five deployments went ERROR before it surfaced.
  #
  # Feature branches now run the TS job, which is the one that builds. The Rust
  # and replay jobs stay master/PR-only: cargo check is 90 minutes and this
  # repository has one developer, so paying it on every feature push buys
  # nothing the pre-merge run does not already buy.
  push:
    branches:
      - master
      - 'feat/**'
      - 'fix/**'
      - 'reconcile/**'
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ts-lint-build-test:
    name: TS — Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          # Match `packageManager` in package.json exactly. CI was on 10.34.0
          # while the field, the lockfile target and every developer are on
          # 9.15.9 -- a MAJOR apart. pnpm 10 changed a default that matters:
          # dependency lifecycle scripts no longer run unless explicitly
          # allowed, so a package that needs a postinstall behaves differently
          # in CI than it does on a laptop, and the difference is silent.
          #
          # If this needs to move to 10, move `packageManager` first and let
          # everyone's `pnpm install` follow. The declaration leads; CI does not.
          version: 9.15.9

      - name: Setup Node.js
        # Read from .node-version rather than pinned here. The hardcoded 22 was
        # set in a778d7d0 (2026-03-03) and never moved; .node-version says 24 and
        # package.json declares `engines.node: "24.x"`, so CI has been testing on
        # a runtime this repository says it does not support.
        #
        # The drift is not cosmetic. Node 25 ships a global `localStorage` stub
        # that shadows jsdom's, and running the web suite under it produces 67
        # failures that are entirely the shadowing -- MEASURED 2026-08-26, 73 red
        # under Node 25 against 6 under Node 24. A runtime this suite is sensitive
        # to is one CI should be reading from the same file developers do.
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check & Build
        run: pnpm turbo run build

      - name: Test
        # ⛔ --concurrency=2 IS NOT TUNING, IT STOPS A GREEN RUN REPORTING RED.
        #
        # MEASURED 2026-08-26 on run 33008647213: stark-prover reported
        # "Test Files 7 passed / Tests 67 passed" AND exited 1, on
        #   Error: [vitest-worker]: Timeout calling "onTaskUpdate"
        # — vitest's reporter RPC timing out, not an assertion. Nothing failed.
        #
        # That package spends 145s inside WASM proving. Unbounded turbo ran all
        # 17 tasks at once on a 2-core runner, the worker could not answer the
        # reporter in time, and the step went red with no failing test in it.
        # A red that names no test teaches nothing and gets ignored, which is
        # how this repository ends up not reading its own CI.
        run: pnpm turbo run test --continue --concurrency=2

      # `turbo run test` calls each package's own `test` script. For apps/web
      # that is `vitest run` against vitest.config.ts, whose `include` covers
      # `__tests__/**` ONLY. Two of the three web suites therefore never ran in
      # CI, and one of them holds the only mechanised privacy check in the repo:
      # denominatedPool.test.ts scans every 8-byte window of the unshield
      # instruction for the note blinding, with a positive control so it cannot
      # pass vacuously. A suite that guards a privacy property and never runs is
      # worse than no suite, because its green is quoted as evidence.
      #
      # Run them explicitly rather than widening vitest.config.ts's `include`:
      # the pool suite needs the REAL @solana/web3.js in a node environment,
      # while the default jsdom setup mocks it for component rendering. Merging
      # them would break both.
      - name: Test — apps/web pool suite (node env, real web3.js)
        run: pnpm --filter @protocol-01/web test:pool

      - name: Test — apps/web rendering suite
        run: pnpm --filter @protocol-01/web test:ui

  rust-programs-build:
    name: Rust — Programs cargo check
    runs-on: ubuntu-latest
    # Master and pre-merge only — see the note on the triggers above.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    # 🚨 WAS 30, AND THE PIN LOOP BELOW COULD NOT FIT IN IT. MEASURED 2026-08-26
    # on a 6c/12t laptop, --release: `honest_liveness` alone is 2,208s — 37
    # minutes, over the whole old budget by itself — and the eighteen pins total
    # ~51 minutes. A hosted runner has fewer cores, so it is slower, not faster.
    # This job was being killed by its own timeout, which reads in the UI as a
    # flaky infrastructure failure rather than as "the gate never ran".
    #
    # 90 rather than 60: the cache can miss, and a gate that is sometimes killed
    # teaches people to re-run it rather than read it.
    #
    # If this becomes painful, the fix is to SPLIT — fast pins on push, the two
    # slow ones (`honest_liveness` 2,208s, `c6_padding_rows` 308s) in their own
    # job — not to drop a pin. `CI_UNRUN_TEST_TARGETS` in cu_budget.rs is where
    # a dropped one would have to be written down, with its reason.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # p01-arcium is excluded because its Arcium macros
      # (init_computation_definition_accounts, queue_computation_accounts,
      # callback_accounts, arcium_callback) read .arcis bytecode files from
      # programs/p01_arcium/build/ at proc-macro expansion time. Those files
      # are produced by `arcium build` (Arcium CLI / Arcis compiler), not by
      # cargo, and are gitignored. CI does not have the Arcium toolchain.
      # Local devs run `arcium build` once, then `cargo check` works there.
      - name: cargo check (workspace, excl. p01-arcium)
        run: cargo check --workspace --all-targets --exclude p01-arcium --exclude encrypted-ixs

      # This is a real gate, not a formality. `eval_periodic_stride_at_z` and
      # `eval_periodic_ext_at_z` in the verifier perform NO runtime validation
      # by design — a sparsity scan would cost exactly what the rewrite saves —
      # so `tests/periodic_stride.rs` IS the entire safety argument for the A3
      # and A4 periodic-column rewrites. It re-derives every constant from the
      # dense tables in `periodic_consts.rs` and fails if a rebake was not
      # mirrored. `cargo check --all-targets` COMPILES these tests but never
      # runs them, so until this step existed the pin was never executed.
      #
      # Release mode is required: the older `eval_periodic_stride16_at_z` hides
      # its sparsity check behind `#[cfg(debug_assertions)]`, so a debug-only
      # run would not exercise the profile that actually ships.
      #
      # [B4] `tests/b4_pair_leaf.rs` is the fails-closed guard for the pair-leaf
      # Merkle commitment. The pair index, the order of the two halves inside a
      # leaf, and the path depth are agreed between prover and verifier but
      # never travel on the wire, so nothing else catches a drift. That test
      # runs the prover under three deliberately different pair layouts and
      # asserts the verifier rejects each with MerkleProofFailed. If it is not
      # executed, a silent prover/verifier disagreement is possible.
      # A pin can only guard code that is present. `periodic_stride` imports
      # `p01_stark_verifier::periodic_ext_consts` and `b4_pair_leaf` drives
      # `p01_stark::compact::PairIndexing`; on a branch that does not carry the
      # A3/A4/B4 rewrites, neither module exists, so naming the test target
      # unconditionally made the job die with `no test target named
      # periodic_stride` — a red build that says nothing about the code under
      # test. This step therefore runs each pin IF its target exists, and
      # prints the ones it skipped so an absence is visible in the log rather
      # than silent. The moment a pin lands, it starts being enforced here with
      # no further edit to this file.
      #
      # `--lib` and `fri_end_to_end` are NOT guarded: they exist on every
      # branch, and a missing one is a genuine regression that must stay red.
      # ⛔ CLIPPY RUNS BEFORE THE LONG TESTS, AND THAT ORDER IS THE POINT.
      #
      # It used to be last. MEASURED on run 33075… : the verifier test step
      # alone held the runner for 57 of the job's 90-minute budget, and three
      # more test steps sat between it and clippy — so the job TIMED OUT before
      # ever reaching the question it was being asked. A gate that cannot be
      # read is not a gate.
      #
      # Clippy takes seconds and needs nothing the tests produce. Moving it
      # ahead costs the long tests nothing and turns "we never found out" into
      # a verdict in about two minutes.
      #
      # ⚠️ It still runs with -D warnings, and that is what protects these
      # programs. The ORDER changed, not the strictness.
      - name: cargo clippy (warnings as errors on hot programs)
        run: |
          cargo clippy -p zk_shielded -- -D warnings
          cargo clippy -p p01_stark_verifier -- -D warnings
          cargo clippy -p p01_relayer -- -D warnings


      # ⛔ ONE CANONICAL PIN LIST, FILTERED BY EACH JOB. Do not fork it.
      #
      # These eighteen pins used to run in ONE step, and that step held the
      # runner for 68 of the job's 90 minutes on 2026-08-27 while two further
      # test steps waited behind it. The job timed out without reaching them —
      # twice — which reads in the UI as flaky infrastructure rather than as
      # "the gate never ran". `honest_liveness` alone is 2,208s on a 6c/12t
      # laptop in --release; a hosted runner has fewer cores.
      #
      # So the two slow pins moved to `rust-slow-pins`, their own job with its
      # own budget. THE LIST DID NOT MOVE WITH THEM.
      #
      # 🚨 WHY THE LIST STAYS WHOLE HERE. The loop below does two things: it
      # RUNS some pins, and it asserts that EVERY pin in ALL_PINS still exists
      # as a cargo target. Splitting the list in two would split that assertion
      # too, and a pin deleted from the tree would then be missing from a list
      # nobody checks — the exact "dropped pin" this step's own error message
      # was written to prevent. Each job therefore checks ALL of them and runs
      # its half.
      #
      # If a pin is ever genuinely retired, `CI_UNRUN_TEST_TARGETS` in
      # cu_budget.rs is where it has to be written down, with its reason.
      - name: cargo test (verifier — the fast soundness pins)
        env:
          ALL_PINS: >-
            periodic_stride b4_pair_leaf wire_parity honest_liveness
            cross_circuit_confusion c7_binding a4_probe b1_deep_binding
            b2_bits_measured b2_segment_binding b7_coset_shift_pairing
            c5_conservation_probe c6_padding_rows liveness_fix_attack
            merkle_domain_sep ood_column_probe route_c_trace_pair
            phase_binding_seam c7_pin_coverage
          SLOW_PINS: honest_liveness c6_padding_rows
        run: |
          set -euo pipefail
          cargo test -p p01_stark_verifier --lib
          cargo test -p p01_stark_verifier --release --test fri_end_to_end

          targets="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "p01_stark_verifier") | .targets[] | select(.kind[] == "test") | .name')"

          # Existence is checked over the WHOLE list, in both jobs. Running is
          # split; asserting is not.
          missing=""
          for pin in $ALL_PINS; do
            printf '%s\n' "$targets" | grep -qx "$pin" || missing="$missing $pin"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Soundness pin absent::Les gardes suivantes ne sont exercees NULLE PART:$missing. Une epingle retiree doit etre inscrite dans CI_UNRUN_TEST_TARGETS (cu_budget.rs) avec sa raison."
            exit 1
          fi

          for pin in $ALL_PINS; do
            case " $SLOW_PINS " in *" $pin "*) continue;; esac
            echo "::group::pin $pin"
            cargo test -p p01_stark_verifier --release --test "$pin"
            echo "::endgroup::"
          done

      - name: cargo test (zk_shielded — the subscription state machine + the merge guard)
        run: |
          cargo test -p zk_shielded --lib
          cargo test -p zk_shielded --test landed_invariants
          # 🚨 ADDED 2026-08-26, and it must never be dropped for being cheap.
          # It pins the canonical VALUE bound on the nullifier across every
          # live STARK-backed spend. Without that bound n and n + p are two
          # nullifier PDAs for one field element — one witness, two honest
          # proofs, the note paid twice, grindable at deposit in ~2^32 hashes.
          # The bound shipped in QvJqCsnw…; this is what stops it being
          # deleted by a refactor that reads as tidying.
          cargo test -p zk_shielded --test nullifier_canonical_bound
          # 🚨 ADDED 2026-08-22. Ten assertions guarding the drain that was LIVE
          # on devnet on 2026-08-18 — the deployed binary still routed
          # `unshield`, class FUND LOSS, measured on the program dump rather
          # than deduced — and CI executed NONE of them. Green locally, run by
          # nothing, which is the same as not having them.
          #
          # ⚠️ `--skip the_built_program_cannot_dispatch` IS NOT A WEAKENING, it
          # is what makes this runnable here at all. That file says so itself:
          # most of its guards are SOURCE SCANS, because the property is an
          # implication ("routable only if it proves membership") and an
          # implication is a fact about the source. Those need no toolchain.
          # The two excluded ones execute the real SBF artifact and read
          # `target/deploy/zk_shielded.so` with an `unwrap_or_else` that
          # PANICS when it is absent — this job has no `cargo-build-sbf`, so
          # including them would fail for a missing toolchain and teach everyone
          # to ignore a red step. They stay a local acceptance check, exactly
          # like `subscription_lifecycle` and `cu_budget.rs` above, whose
          # comment explains the same constraint and which is why it is
          # deliberately NOT added here.
          cargo test -p zk_shielded --test unshield_c5_membership -- \
            --skip the_built_program_cannot_dispatch \
            --skip every_still_registered_instruction_still_dispatches
          # ⛔ THE SECOND SKIP WAS ADDED 2026-08-26 AFTER IT BROKE MASTER.
          #
          # `every_still_registered_instruction_still_dispatches` landed with the
          # subscribe-v4 work and, like the two guards above it, EXECUTES REAL SBF
          # BYTECODE — it loads target/deploy/zk_shielded.so. This job never builds
          # that artifact, so on CI it fails with "CANNOT EXECUTE — the program
          # artifact is not readable" while passing on any machine that happens to
          # have a .so lying around. It passed locally for exactly that reason and
          # went red the first time the Rust job ran on master.
          #
          # ⚠️ SKIPPING IT MEANS NOTHING HERE CHECKS THAT THE BUILT PROGRAM STILL
          # DISPATCHES WHAT IT REGISTERS. That check is real and it is now unrun.
          # The honest fix is to build the .so in this job — cargo-build-sbf, ~10
          # minutes — and drop both skips. Until someone pays that, this line is a
          # deferral, not a resolution, and it should be read as one.

      # 🚨 THE PROVER'S OWN TESTS EXECUTED NOWHERE. `cargo check --workspace
      # --all-targets` above COMPILES `p01-stark` and never runs it, and no step
      # in this file names the package — the only mention of `p01-stark` in the
      # whole workflow is a comment saying it is a dev-dependency.
      #
      # MEASURED 2026-08-26: 171 tests, all green, none of them ever run here.
      # 166 are unit tests inside the crate, 67 in `compact.rs` alone, which is
      # the prover. So the artifact every client ships was checked by nothing on
      # any push, while the VERIFIER next to it had eighteen pins.
      #
      # `cu_budget.rs`'s coverage scanner did not catch this: it reads
      # `programs/p01_stark_verifier/tests/` and has no opinion about other
      # crates. A scanner is only as wide as its directory.
      #
      # Three expensive probes carry `#[ignore]` with their measured runtimes
      # written into the attribute (~5s, ~25s, ~25s) and stay skipped by
      # default, which is why this costs ~35s of test time rather than minutes.
      # Run them locally with `-- --ignored` when touching depth or leaf width.
      - name: cargo test (prover — 171 tests that ran in no CI job at all)
        run: cargo test --release -p p01-stark

      # `continue-on-error: true` was on this step, which made it advisory: a real
      # failure still passed the job, so `-D warnings` pinned nothing. Removed.
      # zk_shielded's three warnings (an unused import and two constants orphaned
      # by the Groth16 removal) were cleared to make this a gate rather than a
      # permanently-red step someone would eventually re-silence.
  # ⛔ THE TWO SLOW PINS, IN THEIR OWN JOB. Split on 2026-08-27, not dropped.
  #
  # They lived in `rust-programs-build` and held it for 68 of its 90 minutes
  # while two further test steps waited behind them. That job timed out twice
  # without reaching them, which reads as flaky infrastructure rather than as
  # "the gate never ran" — and the second time it was hiding a clippy verdict
  # someone was waiting on.
  #
  # `honest_liveness` is 2,208s on a 6c/12t laptop in --release; a hosted
  # runner has fewer cores, so it is slower. `c6_padding_rows` is 308s. Neither
  # is negotiable: honest_liveness is what proves an honest C7 proof clears
  # BOTH verifier phases, and its dispatch used to fall through to `_ => Ok(())`
  # so a circuit added to the fixtures and forgotten there passed phase 2
  # VACUOUSLY.
  #
  # ⚠️ THE PIN LIST IS NOT DUPLICATED HERE — the same ALL_PINS is asserted in
  # both jobs and each runs its half. Splitting the assertion would let a pin
  # deleted from the tree go missing from a list nobody checks.
  rust-slow-pins:
    name: Rust — the two slow soundness pins
    runs-on: ubuntu-latest
    # Master and pre-merge only, like the job it was split out of.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-slowpins-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-slowpins-

      - name: cargo test (the two slow pins)
        env:
          ALL_PINS: >-
            periodic_stride b4_pair_leaf wire_parity honest_liveness
            cross_circuit_confusion c7_binding a4_probe b1_deep_binding
            b2_bits_measured b2_segment_binding b7_coset_shift_pairing
            c5_conservation_probe c6_padding_rows liveness_fix_attack
            merkle_domain_sep ood_column_probe route_c_trace_pair
            phase_binding_seam c7_pin_coverage
          SLOW_PINS: honest_liveness c6_padding_rows
        run: |
          set -euo pipefail
          targets="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "p01_stark_verifier") | .targets[] | select(.kind[] == "test") | .name')"

          # Same whole-list assertion as the fast job. Both check everything;
          # only the running is split.
          missing=""
          for pin in $ALL_PINS; do
            printf '%s\n' "$targets" | grep -qx "$pin" || missing="$missing $pin"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Soundness pin absent::Les gardes suivantes ne sont exercees NULLE PART:$missing. Une epingle retiree doit etre inscrite dans CI_UNRUN_TEST_TARGETS (cu_budget.rs) avec sa raison."
            exit 1
          fi

          for pin in $SLOW_PINS; do
            echo "::group::pin $pin"
            cargo test -p p01_stark_verifier --release --test "$pin"
            echo "::endgroup::"
          done

  verify-unlinkability-controls:
    name: Verify — unlinkability probe controls (offline replay)
    runs-on: ubuntu-latest
    # Master and pre-merge only — see the note on the triggers above.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Same as the job above: read the version from .node-version so CI and
        # developers cannot drift apart.
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # verify/p01-verify.mjs is the only mechanised check that a pool spend
      # cannot be walked back to its deposit from PUBLIC chain data (the vitest
      # pool suite above checks the instruction bytes in memory; this one reads
      # what an outside analyst actually reads, proof upload included). Its
      # credibility rests on a control pair plus a regression pin, and a
      # control that is not executed on every push rots into a rubber stamp:
      #
      #   negative — fixtures/v3-subscribe is a RECORDED devnet
      #   subscribe_private_stark spend. v3 publishes the commitment by design,
      #   so P1/P2/P4 must FAIL on it, exactly as pinned in its manifest. If
      #   the tool ever reports that spend clean, the tool is broken and every
      #   green it has ever produced is void.
      #
      #   positive — fixtures/v4-synthetic is HAND-BUILT (see its README; it
      #   is not a real transaction) and describes a spend whose instruction
      #   carries no commitment. P1/P2/P4 must PASS on it. Without this half a
      #   tool that hard-failed everything would sail through the negative
      #   control, and a future green on a real v4 would be unfalsifiable.
      #
      #   regression pin — fixtures/v4-synthetic-errored is HAND-BUILT too:
      #   the same clean spend, but the payer history carries two ERRORED
      #   signatures. Errored entries are skipped, not scanned, and the P3
      #   completeness test must count them (`scanned + errored`,
      #   p01-verify.mjs scanProofChunks). The pre-fix arithmetic compared
      #   `scanned` alone, so one failed transaction anywhere in a payer's
      #   history forced P3 INCONCLUSIVE forever, with advice
      #   (--max-chunk-tx) that could never help. P3 is pinned PASS here;
      #   both control fixtures have zero errored entries, so this step is
      #   the only one that goes red if that bug returns.
      #
      # All three fixtures also pin P3b = FAIL: the interpolation
      # witness-recovery channel stays INCONCLUSIVE until trace blinding
      # ships, and this is where a well-meaning "fix" that makes it pass goes
      # red first.
      #
      # Replay mode answers every RPC read from the committed fixture — no
      # network, no devnet flake, no rate limit, deterministic, ~1 s. That is
      # why these are hard gates and not advisory: there is no flakiness left
      # to be advisory about.
      - name: Negative control — recorded v3 spend must stay detected as linkable
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v3-subscribe

      - name: Positive control — synthetic v4 spend must stay reported clean
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-synthetic

      # Measured red against the pre-fix arithmetic (`scanned` compared alone,
      # without `+ errored`): P3 pinned PASS, measured FAIL, exit 1. The two
      # fixtures above carry zero errored entries and stay green under that
      # regression; this step is the only one that catches it.
      - name: Regression pin — errored payer history must not break P3 completeness
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-synthetic-errored

      # The three above are constructed: two hand-built and one chosen because
      # it leaks. This one is the first circuit-7 spend that ever landed, frozen
      # as it measured. It pins BOTH halves of the real result — P1/P2/P4 PASS
      # because the v4 instruction carries no commitment argument at all, and
      # P11 FAILS because the fee payer is the upgrade authority of the pool and
      # the verifier and is printed in README.md. A fixture that pinned only the
      # green half would teach a future reader the opposite of what was
      # measured. See verify/fixtures/v4-live/README.md.
      - name: Reality pin — the first real v4 spend, green and red exactly as measured
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-live

      # v4-live froze the first C7 spend that ever landed — made by calling the
      # service directly, past everything an application goes through. This one
      # went through the worker protocol, so it is the first spend that exercised
      # prepareUnshieldJobV4, the routing branch, the XOR guard, the pre-blinding
      # refusal and the job store's version tag. All written 2026-08-26; none had
      # met a real transaction before it.
      #
      # It pins the improvement AND its limit. P6's report ends "7gWpzSZA… is NOT
      # among the spend payer's 11 counterparty edges" — the operator is not on
      # this withdrawal at all, which v4-live cannot say. P11 still reaches it in
      # TWO hops, through the fresh payer's own funding history, because devnet
      # had no third party to fund that key.
      #
      # And P10 is pinned FAIL here where v4-live pins it PASS. Nothing regressed:
      # the payee's 0.995 SOL was swept home, which gave it an outbound edge.
      # Recovering the money re-links the address. Both fixtures together say that
      # better than either says alone.
      - name: Reality pin — the first v4 spend through the app, not past it
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-wired

      # 🚨 THE ONLY FIXTURE RECORDED AGAINST THE BINARY THAT IS DEPLOYED.
      # v4-live and v4-wired both froze the program as it existed BEFORE
      # QvJqCsnw… — before the canonical nullifier bound that closed a double
      # spend, before subscribe_private_stark_v4, before the SPL destination
      # binding. They stay because they are the historical record; this one is
      # the one to cite as current. Its measures are identical to v4-wired
      # (P6:11, P10:1, P11:1), which is the point: a soundness fix must not
      # move privacy, and a fixture showing otherwise would mean something
      # changed by accident.
      - name: Reality pin — the first v4 spend against the redeployed program
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-redeployed

      # 🚨 THE FIRST SUBSCRIPTION EVER PROVED ON CIRCUIT 7.
      # subscribe_private_stark_v4 shipped in QvJqCsnw… and nothing called it
      # for a day; 687 offline tests were green the whole time. This pins the
      # transaction that finally did. Note P10 reads `unread` here and
      # `structural` on a withdrawal — a subscribe has no payee ARGUMENT, it
      # pays a vault PDA — which is why the probe class is derived from the run
      # and not from a table keyed by probe id.
      - name: Reality pin — the first circuit-7 subscription
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-subscribe

      # NOT about unlinkability, and it lives here for a mechanical reason: it
      # imports only node: builtins and two sibling .mjs files, so this is the
      # one job that can run it without an install.
      #
      # What it gates: the checked-in prover blob against the RECORDED devnet
      # deployment, all four inlined base64 twins against the canonical blob,
      # and the behavioural fixture table against its two authorities
      # (b1_deep_binding.rs and wireFormat.test.ts) — the cross-check that
      # catches a pin recovered from an old branch disagreeing with a pin still
      # being generated.
      #
      # MEASURED 2026-08-26: NOTHING ran this script. No npm script, no CI job,
      # while its own failure text claimed "every build and publish step that
      # runs this script runs it with --verify-onchain". ~25s offline.
      #
      # The on-chain leg (--verify-onchain) stays manual: it needs a devnet RPC,
      # and the public endpoint rate-limits hard enough that a gate depending on
      # it is a gate that sometimes cannot run. Offline proves the record is
      # self-consistent; it does not ask the chain, and it says so when it passes.
      - name: Prover artifact — blob, four twins, and the fixture table agree
        run: node packages/stark-prover/scripts/deployed-verifier-check.mjs
