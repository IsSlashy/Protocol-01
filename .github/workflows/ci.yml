name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ts-lint-build-test:
    name: TS — Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          # Match `packageManager` in package.json exactly. CI was on 10.34.0
          # while the field, the lockfile target and every developer are on
          # 9.15.9 -- a MAJOR apart. pnpm 10 changed a default that matters:
          # dependency lifecycle scripts no longer run unless explicitly
          # allowed, so a package that needs a postinstall behaves differently
          # in CI than it does on a laptop, and the difference is silent.
          #
          # If this needs to move to 10, move `packageManager` first and let
          # everyone's `pnpm install` follow. The declaration leads; CI does not.
          version: 9.15.9

      - name: Setup Node.js
        # Read from .node-version rather than pinned here. The hardcoded 22 was
        # set in a778d7d0 (2026-03-03) and never moved; .node-version says 24 and
        # package.json declares `engines.node: "24.x"`, so CI has been testing on
        # a runtime this repository says it does not support.
        #
        # The drift is not cosmetic. Node 25 ships a global `localStorage` stub
        # that shadows jsdom's, and running the web suite under it produces 67
        # failures that are entirely the shadowing -- MEASURED 2026-08-26, 73 red
        # under Node 25 against 6 under Node 24. A runtime this suite is sensitive
        # to is one CI should be reading from the same file developers do.
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check & Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test --continue

      # `turbo run test` calls each package's own `test` script. For apps/web
      # that is `vitest run` against vitest.config.ts, whose `include` covers
      # `__tests__/**` ONLY. Two of the three web suites therefore never ran in
      # CI, and one of them holds the only mechanised privacy check in the repo:
      # denominatedPool.test.ts scans every 8-byte window of the unshield
      # instruction for the note blinding, with a positive control so it cannot
      # pass vacuously. A suite that guards a privacy property and never runs is
      # worse than no suite, because its green is quoted as evidence.
      #
      # Run them explicitly rather than widening vitest.config.ts's `include`:
      # the pool suite needs the REAL @solana/web3.js in a node environment,
      # while the default jsdom setup mocks it for component rendering. Merging
      # them would break both.
      - name: Test — apps/web pool suite (node env, real web3.js)
        run: pnpm --filter @protocol-01/web test:pool

      - name: Test — apps/web rendering suite
        run: pnpm --filter @protocol-01/web test:ui

  rust-programs-build:
    name: Rust — Programs cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # p01-arcium is excluded because its Arcium macros
      # (init_computation_definition_accounts, queue_computation_accounts,
      # callback_accounts, arcium_callback) read .arcis bytecode files from
      # programs/p01_arcium/build/ at proc-macro expansion time. Those files
      # are produced by `arcium build` (Arcium CLI / Arcis compiler), not by
      # cargo, and are gitignored. CI does not have the Arcium toolchain.
      # Local devs run `arcium build` once, then `cargo check` works there.
      - name: cargo check (workspace, excl. p01-arcium)
        run: cargo check --workspace --all-targets --exclude p01-arcium --exclude encrypted-ixs

      # This is a real gate, not a formality. `eval_periodic_stride_at_z` and
      # `eval_periodic_ext_at_z` in the verifier perform NO runtime validation
      # by design — a sparsity scan would cost exactly what the rewrite saves —
      # so `tests/periodic_stride.rs` IS the entire safety argument for the A3
      # and A4 periodic-column rewrites. It re-derives every constant from the
      # dense tables in `periodic_consts.rs` and fails if a rebake was not
      # mirrored. `cargo check --all-targets` COMPILES these tests but never
      # runs them, so until this step existed the pin was never executed.
      #
      # Release mode is required: the older `eval_periodic_stride16_at_z` hides
      # its sparsity check behind `#[cfg(debug_assertions)]`, so a debug-only
      # run would not exercise the profile that actually ships.
      #
      # [B4] `tests/b4_pair_leaf.rs` is the fails-closed guard for the pair-leaf
      # Merkle commitment. The pair index, the order of the two halves inside a
      # leaf, and the path depth are agreed between prover and verifier but
      # never travel on the wire, so nothing else catches a drift. That test
      # runs the prover under three deliberately different pair layouts and
      # asserts the verifier rejects each with MerkleProofFailed. If it is not
      # executed, a silent prover/verifier disagreement is possible.
      # A pin can only guard code that is present. `periodic_stride` imports
      # `p01_stark_verifier::periodic_ext_consts` and `b4_pair_leaf` drives
      # `p01_stark::compact::PairIndexing`; on a branch that does not carry the
      # A3/A4/B4 rewrites, neither module exists, so naming the test target
      # unconditionally made the job die with `no test target named
      # periodic_stride` — a red build that says nothing about the code under
      # test. This step therefore runs each pin IF its target exists, and
      # prints the ones it skipped so an absence is visible in the log rather
      # than silent. The moment a pin lands, it starts being enforced here with
      # no further edit to this file.
      #
      # `--lib` and `fri_end_to_end` are NOT guarded: they exist on every
      # branch, and a missing one is a genuine regression that must stay red.
      - name: cargo test (verifier — the periodic-column, field and pair-leaf pins)
        run: |
          set -euo pipefail

          cargo test -p p01_stark_verifier --lib
          cargo test -p p01_stark_verifier --release --test fri_end_to_end

          targets="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "p01_stark_verifier") | .targets[] | select(.kind[] == "test") | .name')"

          # 🚨 AN ABSENT PIN IS AN ERROR, NOT A WARNING. MEASURED 2026-08-22.
          #
          # This loop was written to enforce the pins "the moment one lands, with
          # no further edit". What it actually did was print two `::warning::`
          # lines into a GREEN job, every run, for weeks — and a warning inside a
          # passing job is read by nobody. Both pins were absent the whole time:
          #
          #   periodic_stride  needs p01_stark_verifier::periodic_ext_consts
          #   b4_pair_leaf     needs p01_stark::compact::PairIndexing,
          #                    generate_*_with_pair_indexing, and
          #                    CircuitConfig::quotient_segments
          #
          # ⛔ NONE of those exist on master. They live on
          # `b7-drop-aligned-checks`, so this is not "a test somebody forgot to
          # write": the CODE the pins guard is not on this branch either.
          # Copying the two files over from b7 does not compile — tried, 1 and 10
          # errors respectively.
          #
          # So the job fails, and it names why. A red CI that states "the
          # pair-leaf guard lives on b7 and master cannot run it" is worth more
          # than a green one that whispers it. To make this pass, land the b7
          # verifier work on master — not by deleting this loop.
          # [C7 2026-08-24] Three targets appended. All three now carry C7
          # coverage that exists NOWHERE ELSE in CI:
          #   wire_parity              -- C7's ten CircuitConfig fields
          #   honest_liveness          -- an honest C7 proof clears BOTH phases.
          #                               Its dispatch used to fall through to
          #                               `_ => Ok(())`, so a circuit added to
          #                               the fixtures and forgotten there passed
          #                               phase 2 VACUOUSLY.
          #   cross_circuit_confusion  -- the 8x8 parse matrix. C7 shares C6's
          #                               width, length, blowup, merkle depth and
          #                               query count; only fri_final_poly_size
          #                               separates them, and this is the only
          #                               test that would notice if it stopped.
          #
          # ⛔ `cu_budget` stays OUT and that is deliberate, not an oversight: it
          # needs `cargo-build-sbf`, which this job does not have. Its C7 ceiling
          # row is a LOCAL acceptance check. Nobody should read the C7 CU number
          # as a CI gate. The exclusion is recorded a second time, with the same
          # reason, in `CI_UNRUN_TEST_TARGETS` inside cu_budget.rs — the scan
          # there treats an unnamed target as a coverage hole unless it is
          # excused in writing.
          #
          # [C7 2026-08-25] `c7_binding` appended. It is the only place forgeries
          # 6, 7 and 9 of the spend plan are exercised — recipient malleability,
          # public-input arity, and the tampered-OOD quartet — against the real
          # `verify_deep_ali_circuit_7` rather than against the quotient. It
          # needs no toolchain: `p01-stark` is a dev-dependency and the proofs
          # are generated natively, so unlike `cu_budget` it belongs here.
          #
          # [2026-08-25] Ten more targets appended. They were not "forgotten":
          # the scan in cu_budget.rs that is supposed to notice an unnamed target
          # had been blind to this very loop — it looked for a literal
          # `--test <name>` and this step passes `--test "$pin"` — so it reported
          # zero coverage everywhere and was read as a broken scanner. With the
          # parser fixed it named thirteen targets that executed nowhere. Ten are
          # here; the three that are not are recorded in CI_UNRUN_TEST_TARGETS
          # with the measured reason, including one that is RED on a real defect.
          #
          # Measured wall-clock on a 6c/12t laptop, --release: b1_deep_binding
          # 44s, b2_bits_measured 104s, b2_segment_binding 89s,
          # c5_conservation_probe 116s, c6_padding_rows 425s, liveness_fix_attack
          # 64s, ood_column_probe 30s, route_c_trace_pair 18s, a4_probe 1s,
          # merkle_domain_sep 0s. About 15 minutes total, and c6_padding_rows is
          # nearly half of it.
          missing=""
          for pin in periodic_stride b4_pair_leaf wire_parity honest_liveness cross_circuit_confusion c7_binding \
                     a4_probe b1_deep_binding b2_bits_measured b2_segment_binding b7_coset_shift_pairing \
                     c5_conservation_probe c6_padding_rows liveness_fix_attack merkle_domain_sep \
                     ood_column_probe route_c_trace_pair phase_binding_seam c7_pin_coverage; do
            if printf '%s\n' "$targets" | grep -qx "$pin"; then
              echo "::group::pin $pin"
              cargo test -p p01_stark_verifier --release --test "$pin"
              echo "::endgroup::"
            else
              missing="$missing $pin"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Soundness pin absent::Les gardes suivantes ne sont exercees NULLE PART:$missing. Une porte absente est une ERREUR, pas un avertissement — ce fichier a imprime des ::warning:: dans un job VERT pendant des semaines pour exactement ca. Ne pas supprimer la boucle pour repasser au vert."
            exit 1
          fi

      # The subscription state machine — `claimable_periods` and the funding
      # clamp — decides how much money a merchant is owed, and until this step
      # existed NOTHING in CI executed it. The step above runs `cargo check
      # --all-targets`, which COMPILES the eight tests in
      # `src/state/subscription_vault.rs` and never runs them: renaming or
      # deleting `claimable_periods` went red, while silently changing what it
      # RETURNS stayed green. Verified locally 2026-08-04, first execution in the
      # project's history: 9 passed.
      #
      # `--lib` only, deliberately. `tests/subscription_lifecycle.rs` executes the
      # real `target/deploy/zk_shielded.so` in litesvm, and this job has no
      # `cargo-build-sbf` — the same reason `cu_budget.rs` is absent above. That
      # harness fails closed rather than skipping when the `.so` is missing, so
      # adding it here without a toolchain step would fail the job for a reason
      # that has nothing to do with the code. Run it locally:
      #   cargo test -p zk_shielded --test subscription_lifecycle
      # after building the artifact with the absolute 3.1.9 cargo-build-sbf path
      # named in that file's header. It is the acceptance criterion for the
      # no-cancel landing: the same file, unchanged, on HEAD and on the branch.
      # `--lib` and `--test landed_invariants` are BOTH needed, and the second is
      # not redundant. MEASURED 2026-08-04: resolving `claim_period.rs` to the
      # pre-landing version — the shape the STARK/B7 line still carries — compiles
      # cleanly, and `--lib` goes from 30 tests to 23 with every one of them
      # PASSING. The lot's own `mod plumbing_guards` lives inside
      # `claim_period.rs`, so a resolution that deletes the behaviour deletes the
      # guards in the same stroke and nothing turns red.
      #
      # `tests/landed_invariants.rs` sits outside that file and fired 4 failures
      # on the same mutation, each naming the property lost. It reads source text,
      # so it needs no `.so` and runs here.
      - name: cargo test (zk_shielded — the subscription state machine + the merge guard)
        run: |
          cargo test -p zk_shielded --lib
          cargo test -p zk_shielded --test landed_invariants
          # 🚨 ADDED 2026-08-22. Ten assertions guarding the drain that was LIVE
          # on devnet on 2026-08-18 — the deployed binary still routed
          # `unshield`, class FUND LOSS, measured on the program dump rather
          # than deduced — and CI executed NONE of them. Green locally, run by
          # nothing, which is the same as not having them.
          #
          # ⚠️ `--skip the_built_program_cannot_dispatch` IS NOT A WEAKENING, it
          # is what makes this runnable here at all. That file says so itself:
          # most of its guards are SOURCE SCANS, because the property is an
          # implication ("routable only if it proves membership") and an
          # implication is a fact about the source. Those need no toolchain.
          # The two excluded ones execute the real SBF artifact and read
          # `target/deploy/zk_shielded.so` with an `unwrap_or_else` that
          # PANICS when it is absent — this job has no `cargo-build-sbf`, so
          # including them would fail for a missing toolchain and teach everyone
          # to ignore a red step. They stay a local acceptance check, exactly
          # like `subscription_lifecycle` and `cu_budget.rs` above, whose
          # comment explains the same constraint and which is why it is
          # deliberately NOT added here.
          cargo test -p zk_shielded --test unshield_c5_membership -- \
            --skip the_built_program_cannot_dispatch

      # `continue-on-error: true` was on this step, which made it advisory: a real
      # failure still passed the job, so `-D warnings` pinned nothing. Removed.
      # zk_shielded's three warnings (an unused import and two constants orphaned
      # by the Groth16 removal) were cleared to make this a gate rather than a
      # permanently-red step someone would eventually re-silence.
      - name: cargo clippy (warnings as errors on hot programs)
        run: |
          cargo clippy -p zk_shielded -- -D warnings
          cargo clippy -p p01_stark_verifier -- -D warnings
          cargo clippy -p p01_relayer -- -D warnings

  verify-unlinkability-controls:
    name: Verify — unlinkability probe controls (offline replay)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Same as the job above: read the version from .node-version so CI and
        # developers cannot drift apart.
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # verify/p01-verify.mjs is the only mechanised check that a pool spend
      # cannot be walked back to its deposit from PUBLIC chain data (the vitest
      # pool suite above checks the instruction bytes in memory; this one reads
      # what an outside analyst actually reads, proof upload included). Its
      # credibility rests on a control pair plus a regression pin, and a
      # control that is not executed on every push rots into a rubber stamp:
      #
      #   negative — fixtures/v3-subscribe is a RECORDED devnet
      #   subscribe_private_stark spend. v3 publishes the commitment by design,
      #   so P1/P2/P4 must FAIL on it, exactly as pinned in its manifest. If
      #   the tool ever reports that spend clean, the tool is broken and every
      #   green it has ever produced is void.
      #
      #   positive — fixtures/v4-synthetic is HAND-BUILT (see its README; it
      #   is not a real transaction) and describes a spend whose instruction
      #   carries no commitment. P1/P2/P4 must PASS on it. Without this half a
      #   tool that hard-failed everything would sail through the negative
      #   control, and a future green on a real v4 would be unfalsifiable.
      #
      #   regression pin — fixtures/v4-synthetic-errored is HAND-BUILT too:
      #   the same clean spend, but the payer history carries two ERRORED
      #   signatures. Errored entries are skipped, not scanned, and the P3
      #   completeness test must count them (`scanned + errored`,
      #   p01-verify.mjs scanProofChunks). The pre-fix arithmetic compared
      #   `scanned` alone, so one failed transaction anywhere in a payer's
      #   history forced P3 INCONCLUSIVE forever, with advice
      #   (--max-chunk-tx) that could never help. P3 is pinned PASS here;
      #   both control fixtures have zero errored entries, so this step is
      #   the only one that goes red if that bug returns.
      #
      # All three fixtures also pin P3b = FAIL: the interpolation
      # witness-recovery channel stays INCONCLUSIVE until trace blinding
      # ships, and this is where a well-meaning "fix" that makes it pass goes
      # red first.
      #
      # Replay mode answers every RPC read from the committed fixture — no
      # network, no devnet flake, no rate limit, deterministic, ~1 s. That is
      # why these are hard gates and not advisory: there is no flakiness left
      # to be advisory about.
      - name: Negative control — recorded v3 spend must stay detected as linkable
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v3-subscribe

      - name: Positive control — synthetic v4 spend must stay reported clean
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-synthetic

      # Measured red against the pre-fix arithmetic (`scanned` compared alone,
      # without `+ errored`): P3 pinned PASS, measured FAIL, exit 1. The two
      # fixtures above carry zero errored entries and stay green under that
      # regression; this step is the only one that catches it.
      - name: Regression pin — errored payer history must not break P3 completeness
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-synthetic-errored

      # The three above are constructed: two hand-built and one chosen because
      # it leaks. This one is the first circuit-7 spend that ever landed, frozen
      # as it measured. It pins BOTH halves of the real result — P1/P2/P4 PASS
      # because the v4 instruction carries no commitment argument at all, and
      # P11 FAILS because the fee payer is the upgrade authority of the pool and
      # the verifier and is printed in README.md. A fixture that pinned only the
      # green half would teach a future reader the opposite of what was
      # measured. See verify/fixtures/v4-live/README.md.
      - name: Reality pin — the first real v4 spend, green and red exactly as measured
        run: node verify/p01-verify.mjs --self-test --replay verify/fixtures/v4-live

      # NOT about unlinkability, and it lives here for a mechanical reason: it
      # imports only node: builtins and two sibling .mjs files, so this is the
      # one job that can run it without an install.
      #
      # What it gates: the checked-in prover blob against the RECORDED devnet
      # deployment, all four inlined base64 twins against the canonical blob,
      # and the behavioural fixture table against its two authorities
      # (b1_deep_binding.rs and wireFormat.test.ts) — the cross-check that
      # catches a pin recovered from an old branch disagreeing with a pin still
      # being generated.
      #
      # MEASURED 2026-08-26: NOTHING ran this script. No npm script, no CI job,
      # while its own failure text claimed "every build and publish step that
      # runs this script runs it with --verify-onchain". ~25s offline.
      #
      # The on-chain leg (--verify-onchain) stays manual: it needs a devnet RPC,
      # and the public endpoint rate-limits hard enough that a gate depending on
      # it is a gate that sometimes cannot run. Offline proves the record is
      # self-consistent; it does not ask the chain, and it says so when it passes.
      - name: Prover artifact — blob, four twins, and the fixture table agree
        run: node packages/stark-prover/scripts/deployed-verifier-check.mjs
