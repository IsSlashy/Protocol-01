name: Settler Keeper

# Permissionless keeper that scans PrefundRecord PDAs owned by p01_liquidity
# and fires settle() for any whose min_epoch has elapsed. Pays ~0.2 bps of the
# prefund amount as `settler_reward` on success.
#
# Manual trigger only. The cron schedule is disabled until mainnet traffic
# justifies a keeper — on devnet there are typically zero PrefundRecords to
# settle, and the scheduled runs were only producing failure emails.
#
# Required repo secrets (before re-enabling the schedule):
#   SETTLER_KEYPAIR_JSON — raw 64-byte Solana keypair JSON (e.g. contents of
#     `~/.config/solana/id.json`). Must be funded with a small amount of SOL
#     on the target network to cover tx fees; reward income is paid to the
#     same pubkey on every successful settle.
#   SETTLER_RPC_URL      — RPC endpoint (prefer Helius; public devnet throttles).
on:
  workflow_dispatch:

concurrency:
  group: settler-keeper
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    # 20, not 10: the frozen install below is the whole workspace, not two packages.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # NOTHING THAT RUNS NEXT TO THE KEY IS RESOLVED ON THE DAY.
      # This used to be `npm install --no-save tsx @solana/web3.js@^1.98.4`
      # then `npx tsx`. This is a pnpm workspace with no package-lock.json, so
      # npm resolved the root tree fresh on every run and executed whatever the
      # registry served inside `^1` with SETTLER_KEYPAIR_JSON in env (web3.js
      # 1.x already had one key-stealing publish, 1.95.6/1.95.7, Dec 2024).
      # Now: the pnpm that package.json declares, pnpm-lock.yaml frozen (tsx
      # and @solana/web3.js are root devDependencies, pinned with integrity
      # hashes), and `pnpm exec` so nothing is fetched at run time.
      # Checked by scripts/ci/run-settler-pins.test.mjs (audit v1 r2, lane 4).
      - name: Check the install is pinned
        run: node --test scripts/ci/run-settler-pins.test.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Run settler
        env:
          SETTLER_KEYPAIR_JSON: ${{ secrets.SETTLER_KEYPAIR_JSON }}
          RPC_URL: ${{ secrets.SETTLER_RPC_URL }}
        run: pnpm exec tsx scripts/run-settler.ts
