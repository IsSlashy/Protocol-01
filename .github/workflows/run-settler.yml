name: Settler Keeper (report-only — settle cannot succeed)

# Scans PrefundRecord PDAs owned by p01_liquidity and REPORTS on them. It does
# not settle anything, because nothing can:
#
#   `p01_liquidity::settle` CPIs `zk_shielded::unshield_denominated_stark`,
#   retired on purpose by f5bb7514 ("circuit-1 only, no C3 membership =
#   unshield-undeposited risk") and replaced by
#   `unshield_denominated_stark_v3`, which carries no prefund path. Both
#   `settle` and `prefund` now return `LiquidityError::SettlementPathRetired`.
#   See programs/p01_liquidity/src/settlement_path.rs.
#
# The workflow is kept rather than deleted, and it is deliberately still
# runnable: as of 2026-08-03 it is the cheapest way to see that devnet holds a
# permanently stranded PrefundRecord (EAFRWmV…, 0.005388032 SOL prefunded out
# of the LP reserve plus 0.00279 SOL of rent, unrecoverable). Re-check with
# `node scripts/probe-liquidity-exposure.mjs`, which is read-only.
#
# Manual trigger only, and it was already manual-only before this change —
# there is no cron here to disable. Do NOT add one back until
# `SETTLEMENT_PATH_AVAILABLE` in settlement_path.rs is true.
#
# Secrets are optional now. `SETTLER_KEYPAIR_JSON` is only needed to broadcast,
# which requires SETTLER_FORCE_SEND=1, which will fail on chain today.
#   SETTLER_KEYPAIR_JSON — raw 64-byte Solana keypair JSON (e.g. contents of
#     `~/.config/solana/id.json`). Must be funded with a small amount of SOL
#     on the target network to cover tx fees; reward income is paid to the
#     same pubkey on every successful settle.
#   SETTLER_RPC_URL      — RPC endpoint (prefer Helius; public devnet throttles).
on:
  workflow_dispatch:

concurrency:
  group: settler-keeper
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tsx + web3.js
        run: npm install --no-save tsx @solana/web3.js@^1.98.4

      # `scripts/run-settler.ts` is tracked despite the `/scripts/` entry in
      # .gitignore (added with `git add -f`), so this checkout does contain it.
      - name: Run settler (report-only)
        env:
          SETTLER_KEYPAIR_JSON: ${{ secrets.SETTLER_KEYPAIR_JSON }}
          RPC_URL: ${{ secrets.SETTLER_RPC_URL }}
        run: npx tsx scripts/run-settler.ts
