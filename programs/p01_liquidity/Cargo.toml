[package]
name = "p01_liquidity"
version = "0.1.0"
description = "P-01 Liquidity Pool — instant unshield via LP-backed prefunding (C2-on)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_liquidity"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))']
