[package]
name = "p01_liquidity"
version = "0.1.0"
description = "P-01 Liquidity Pool — instant unshield via LP-backed prefunding (C2-on). EXPERIMENTAL, not deployed."
keywords = ["protocol-01", "experimental", "not-deployed"]
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_liquidity"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

# `tests/deep_ali_gate.rs` runs the real `target/deploy/p01_liquidity.so` in an
# in-process SBF VM, so the accept/reject decision it asserts is the one the
# validator would make. Same rig as
# `programs/p01_stark_verifier/tests/cu_budget.rs`; see that file's Cargo
# comments for why `five8_core/std` has to be turned on here. Dev-dependencies
# never reach `cargo build-sbf` (resolver = "2" keeps them out of the normal
# graph), so the on-chain artifact is unchanged by this block.
[dev-dependencies]
litesvm = "0.15.1"
five8_core = { version = "0.1.2", features = ["std"] }
solana-account = "4.3"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-message = "4.2"
solana-transaction = "4.1"
solana-address = { version = "2.6", features = ["curve25519", "decode", "std"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))']
