[package]
name = "p01_zkspl"
version = "0.1.0"
description = "Protocol 01 - zkSPL Confidential Token Balances (STARK-verified)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_zkspl"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

# SHA-256 for STARK public input hash binding (must match p01_stark_verifier).
# Uses the `sol_sha256` syscall on BPF (~85 CU/call).
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

# Required for zero-copy accounts
bytemuck = { version = "1.14", features = ["derive"] }

# `tests/deep_ali_gate.rs` runs the real `target/deploy/p01_zkspl.so` in an
# in-process SBF VM, so the accept/reject decision it asserts is the one the
# validator would make. Same rig as
# `programs/p01_stark_verifier/tests/cu_budget.rs`; see that file's Cargo
# comments for why `five8_core/std` has to be turned on here. Dev-dependencies
# never reach `cargo build-sbf` (resolver = "2" keeps them out of the normal
# graph), so the on-chain artifact is unchanged by this block.
[dev-dependencies]
litesvm = "0.15.1"
five8_core = { version = "0.1.2", features = ["std"] }
solana-account = "4.3"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-message = "4.2"
solana-transaction = "4.1"
solana-address = { version = "2.6", features = ["curve25519", "decode", "std"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
