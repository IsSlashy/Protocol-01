[package]
name = "p01_zkspl"
version = "0.1.0"
description = "Protocol 01 - zkSPL Confidential Token Balances (STARK-verified)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_zkspl"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

# SHA-256 for STARK public input hash binding (must match p01_stark_verifier).
# Uses the `sol_sha256` syscall on BPF (~85 CU/call).
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

# Required for zero-copy accounts
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
# Test-only. `stark_proof::phase2_debt` pins this crate's private copy of the
# ProofBuffer layout against the REAL `p01_stark_verifier::ProofBuffer`, and
# pins the known phase-2 gap so it cannot be forgotten or silently "fixed".
# `no-entrypoint` keeps the verifier's BPF entrypoint out of the host test
# binary; its heavy `p01-stark` dependency is dev-only over there and is not
# pulled in here. Same pattern as `zk_shielded`'s `stark_buffer::tests`.
p01_stark_verifier = { path = "../p01_stark_verifier", features = ["no-entrypoint"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
