[package]
name = "p01_stark_verifier"
version = "0.1.0"
description = "Protocol 01 - On-chain STARK proof verifier (quantum-resistant)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_stark_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# `solana_sha256_hasher::hashv` uses the native `sol_sha256` syscall on BPF
# (~85 CU/call). The equivalent `sol_blake3` syscall exists but is gated
# behind an inactive feature on devnet/mainnet, so software Blake3 was
# costing ~15k+ CU/hash and blowing the 1.4M CU cap on FRI verification
# (27 queries × 12 layers × ~22-deep merkle paths). Off-chain (unit tests),
# the crate falls back to `sha2` and results are bit-identical.
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

[dev-dependencies]
p01-stark = { path = "../../stark" }
# [C7 Step 0] Local compute-unit measurement harness (`tests/cu_budget.rs`).
# litesvm loads the built `target/deploy/p01_stark_verifier.so` into an
# in-process SBF VM, so `compute_units_consumed` is the real on-chain number
# without a validator or a devnet transaction. Dev-dependencies never reach
# `cargo build-sbf`, so the on-chain artifact is unchanged.
litesvm = "0.15.1"
# `five8 1.0.0` (pulled in by solana-keypair 3.1.x, itself pulled in by
# litesvm) declares `five8_core = ">=0.1.1,<2"`. The resolver reuses the
# `five8_core 0.1.2` already locked here via solana-pubkey 2.x, and on that
# version `impl std::error::Error for DecodeError` is behind the `std`
# feature (five8_core-0.1.2/src/lib.rs:128-129). Without it solana-keypair
# fails to compile with E0277. Turning `std` on from a DEV-dependency is
# invisible to `cargo build-sbf` (resolver = "2" keeps dev-only features out
# of the normal graph), so the on-chain artifact is untouched.
five8_core = { version = "0.1.2", features = ["std"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-message = "4.2"
solana-transaction = "4.1"
# `curve25519` is what un-gates `Address::find_program_address` off-chain
# (solana-address-2.6.1/src/lib.rs:17-18); `decode` un-gates base58 parsing.
solana-address = { version = "2.6", features = ["curve25519", "decode", "std"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
