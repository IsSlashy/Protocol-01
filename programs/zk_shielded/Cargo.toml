[package]
name = "zk_shielded"
version = "0.1.0"
description = "Protocol 01 - ZK Shielded Pool (STARK base pool; Groth16 retained only for compliance + escrow)"
edition = "2021"
license-file.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_shielded"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

# solana-bn254 / Groth16 alt_bn128 removed: no SNARKs in the production flow.
# Everything is STARK over Goldilocks + Poseidon (hash-based, post-quantum,
# no elliptic curves). The retired Groth16 verifier file was deleted.

# Hash function for verification key hashing
sha3 = "0.10"

# SHA-256 for STARK public input hash binding (must match p01_stark_verifier).
# Uses the `sol_sha256` syscall on BPF (~85 CU/call). Switched from Blake3 in
# P1.6 because `sol_blake3` is gated behind an inactive feature on devnet.
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

# Required for zero-copy accounts
bytemuck = { version = "1.14", features = ["derive"] }

# ---------------------------------------------------------------------------
# Lot 3: the subscription lifecycle harness (`tests/subscription_lifecycle.rs`).
#
# `claim_period` — the entire revenue leg — had never been executed by any
# automated test in this repository. This crate had no [dev-dependencies] and no
# tests/ directory at all; `ci.yml` only ever ran `cargo check` over it, which
# COMPILES the state-machine tests in `src/state/subscription_vault.rs` without
# running them. Changing what `claimable_periods` RETURNS stayed green.
#
# litesvm loads the built `target/deploy/zk_shielded.so` into an in-process SBF
# VM, so the program under test is the real artifact and slots can be warped —
# which is the only way to observe periods accruing one interval at a time. All
# 16 live devnet vaults are time-saturated, so the drip cannot be measured on
# chain at all.
#
# Dev-dependencies never reach `cargo build-sbf`, so the on-chain artifact is
# unchanged by anything below. Stanza transposed from
# `programs/p01_stark_verifier/Cargo.toml:29-54`, which has been working on this
# box; see the note there for why `five8_core`'s `std` feature is required.
# ---------------------------------------------------------------------------
[dev-dependencies]
litesvm = "0.15.1"
five8_core = { version = "0.1.2", features = ["std"] }
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-message = "4.2"
solana-transaction = "4.1"
solana-address = { version = "2.6", features = ["curve25519", "decode", "std"] }
# `set_account` is how the harness seeds a funded vault directly, instead of
# driving `subscribe_private_stark` and having to synthesise STARK proof buffers.
solana-account = "4.3"

# [WP0e C0 replay] `tests/c0_replay.rs` needs a GENUINE, verifier-accepted C0
# proof to demonstrate the pause/resume replay — a fabricated `verified` buffer
# would beg the question. `generate_subscriber_ownership_proof` is the same
# public generator `p01_stark_verifier/tests/cu_budget.rs` and the in-crate
# positive tests use, so the proof under test is known-honest. `test-probes`
# only gates `c0_deterministic_probe_mask` (the publicly reproducible blinding
# mask); it pulls NO extra crates (`stark/Cargo.toml:test-probes = []`), so it
# adds nothing to Cargo.lock beyond one dependency edge. `resolver = "2"` keeps
# this dev-only feature out of the normal graph, and dev-dependencies never
# reach `cargo build-sbf`, so `target/deploy/zk_shielded.so` is untouched.
p01-stark = { path = "../../stark", features = ["test-probes"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
