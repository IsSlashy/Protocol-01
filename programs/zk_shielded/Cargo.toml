[package]
name = "zk_shielded"
version = "0.1.0"
description = "Protocol 01 - ZK Shielded Pool (STARK base pool; Groth16 retained only for compliance + escrow)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_shielded"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

# solana-bn254 / Groth16 alt_bn128 removed: no SNARKs in the production flow.
# Everything is STARK over Goldilocks + Poseidon (hash-based, post-quantum,
# no elliptic curves). The retired Groth16 verifier file was deleted.

# Hash function for verification key hashing
sha3 = "0.10"

# SHA-256 for STARK public input hash binding (must match p01_stark_verifier).
# Uses the `sol_sha256` syscall on BPF (~85 CU/call). Switched from Blake3 in
# P1.6 because `sol_blake3` is gated behind an inactive feature on devnet.
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

# Required for zero-copy accounts
bytemuck = { version = "1.14", features = ["derive"] }

[dev-dependencies]
# Test-only. `stark_buffer::tests` serializes the REAL
# `p01_stark_verifier::ProofBuffer` and parses it back, so the offset table in
# `stark_buffer.rs` is pinned against the account type it claims to describe
# rather than against a copy of itself. `no-entrypoint` keeps the verifier's
# BPF entrypoint out of the host test binary; its own heavy `p01-stark`
# dependency is dev-only over there and is not pulled in here.
p01_stark_verifier = { path = "../p01_stark_verifier", features = ["no-entrypoint"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
