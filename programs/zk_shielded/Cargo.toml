[package]
name = "zk_shielded"
version = "0.1.0"
description = "Protocol 01 - ZK Shielded Pool with Groth16 verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_shielded"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

# BN254 alt_bn128 operations for Groth16 verification (syscalls)
solana-bn254 = "2"

# Hash function for verification key hashing
sha3 = "0.10"

# SHA-256 for STARK public input hash binding (must match p01_stark_verifier).
# Uses the `sol_sha256` syscall on BPF (~85 CU/call). Switched from Blake3 in
# P1.6 because `sol_blake3` is gated behind an inactive feature on devnet.
solana-sha256-hasher = { version = "2.3.0", features = ["sha2"] }

# Required for zero-copy accounts
bytemuck = { version = "1.14", features = ["derive"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
