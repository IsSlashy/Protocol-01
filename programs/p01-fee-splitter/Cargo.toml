[package]
name = "p01-fee-splitter"
version = "0.1.0"
description = "P-01 Network Fee Splitter - Automatically takes 0.5% fee on transactions"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_fee_splitter"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))']
