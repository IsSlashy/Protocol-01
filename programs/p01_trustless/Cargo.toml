[package]
name = "p01_trustless"
version = "0.1.0"
description = "Protocol 01 - Trustless ZK Operations (no relayer required)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_trustless"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"

# BN254 alt_bn128 operations for Groth16 verification (syscalls)
solana-bn254 = "2"

# Hash function for verification key hashing
sha3 = "0.10"

# Required for zero-copy accounts
bytemuck = { version = "1.14", features = ["derive"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
