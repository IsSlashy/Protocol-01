[package]
name = "p01_quantum_vault"
version = "0.1.0"
description = "Protocol 01 - Quantum-safe vault with Winternitz OTS, hash-timelock, and commit-reveal"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "p01_quantum_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

# SHA-256 syscall wrapper — on `target_os = "solana"` this compiles to the
# `sol_sha256` syscall (~85 CU / call), which is ~20x cheaper than linking
# the `sha2` crate into BPF. Critical for the 67-chain WOTS+ verifier whose
# hot path does ~500 SHA-256 ops per withdrawal.
solana-sha256-hasher = "2.3"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]
