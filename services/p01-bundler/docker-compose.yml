# ============================================================================
# P01 Privacy Relay — Docker Compose
# ============================================================================
#
# Two services:
#   1. relay — P01 Bundle Engine (Express.js, port 3099)
#   2. tor   — Tor SOCKS5 proxy (port 9050, internal only)
#
# The relay routes ALL outbound RPC traffic through Tor.
# Upstream RPC providers (Helius, etc.) see a Tor exit node IP,
# never the relay server's real IP.
#
# Deploy:
#   cp .env.example .env   # Edit with your RPC URL + API key
#   docker compose up -d
#
# Verify:
#   curl http://localhost:3099/health
#   curl http://localhost:3099/v1/rpc/stats   # Check torEnabled: true
#
# ============================================================================

services:
  # ── P01 Bundle Engine + Privacy RPC Relay ──
  relay:
    build: .
    container_name: p01-relay
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-3099}:3099"
    environment:
      - PORT=3099
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - UPSTREAM_RPC_URL=${UPSTREAM_RPC_URL:-}
      - TOR_SOCKS_PROXY=socks5h://tor:9050
      - BATCH_WINDOW_MS=${BATCH_WINDOW_MS:-2000}
      - RPC_JITTER_MS=${RPC_JITTER_MS:-300}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - NODE_ENV=production
    depends_on:
      tor:
        condition: service_healthy
    networks:
      - p01-net
    # Resource limits — prevent runaway memory
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # ── Tor SOCKS5 Proxy ──
  tor:
    build: ./tor
    container_name: p01-tor
    restart: unless-stopped
    # NO ports exposed — only accessible from the relay via Docker DNS
    volumes:
      - tor-data:/var/lib/tor
    networks:
      - p01-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

networks:
  p01-net:
    driver: bridge
    # Both services need outbound internet access:
    #   - relay → upstream RPC (via Tor)
    #   - tor → Tor network (directory authorities, guard nodes)
    # Security boundary is at the host firewall level, not Docker networking.

volumes:
  tor-data:
    driver: local
