[package]
name = "p01-stark"
version = "0.1.0"
edition = "2021"
description = "Protocol 01 - STARK proof system (quantum-resistant, no trusted setup)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["winterfell/std"]
wasm = ["wasm-bindgen", "serde", "serde_json", "getrandom"]

# [B1 defect 1] Fails-closed probe knobs: the coordinated OOD forgery and its
# `ood_quotient` re-solve, the `AliasedFold` terminal play, the pre-Route-C
# `LegacyRowLeaf` trace layout and the non-canonical `PairIndexing` variants.
# This is real attack code, so it is OFF in `default` and therefore absent from
# `cargo build` and from `wasm-pack build stark --target web -- --features wasm`.
# Tests need no extra flags: this crate's own unit tests get it through
# `cfg(test)`, and the integration tests in `programs/p01_stark_verifier/tests`
# get it from that crate's dev-dependency on `p01-stark`, which enables the
# feature. `resolver = "2"` (workspace Cargo.toml) keeps dev-only features out
# of the normal graph, so `cargo build-sbf` is unaffected.
test-probes = []

[dependencies]
# Winterfell STARK library (re-exports air, prover, verifier, math, crypto)
winterfell = { version = "0.10", default-features = false }

# SHA-256 for Merkle tree and Fiat-Shamir transcript.
# Chosen over Blake3 because the Solana `sol_blake3` syscall is gated behind a
# runtime feature that is inactive on devnet/mainnet, forcing the on-chain
# verifier onto the software Blake3 path (~15k CU per 64-byte hash). SHA-256
# has `sol_sha256` always active (~85 CU/call), which is what keeps the
# verifier under the 1.4M CU cap. `sha2` via hardware intrinsics on host
# matches the syscall output bit-for-bit.
sha2 = "0.10"

# Hex encoding for proof output
hex = "0.4"

# WASM bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[[bin]]
name = "gen_proof"
path = "src/bin/gen_proof.rs"
required-features = ["std"]

[[bin]]
name = "probe_ood"
path = "src/bin/probe_ood.rs"
required-features = ["std"]

[dev-dependencies]
rand = "0.8"
hex = "0.4"
