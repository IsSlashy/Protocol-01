[package]
name = "p01-stark"
version = "0.1.0"
edition = "2021"
description = "Protocol 01 - STARK proof system (quantum-resistant, no trusted setup)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std", "csprng"]
std = ["winterfell/std"]

# [ZK-RANDOMIZER 2026-08-30] The CSPRNG was reachable ONLY through `wasm`, so
# every non-wasm caller that needed a blinding mask wrote its own -- and each one
# wrote a DETERMINISTIC xorshift. `bin/gen_proof.rs` seeded all four of its arms
# with the same literal, which means a proof it emits blinds nothing at all.
#
# The fix is the one the plan already called for: give the draw its own feature,
# ON by default, and let `wasm` depend on it. The crate is not `no_std` and the
# on-chain verifier only dev-depends on it, so this costs nothing anywhere.
csprng = ["getrandom"]
wasm = ["wasm-bindgen", "serde", "serde_json", "csprng"]

# [B1 defect 1] Fails-closed probe knobs: the coordinated OOD forgery and its
# `ood_quotient` re-solve, the `AliasedFold` terminal play, the pre-Route-C
# `LegacyRowLeaf` trace layout and the non-canonical `PairIndexing` variants.
# This is real attack code, so it is OFF in `default` and therefore absent from
# `cargo build` and from `wasm-pack build stark --target web -- --features wasm`.
# Tests need no extra flags: this crate's own unit tests get it through
# `cfg(test)`, and the integration tests in `programs/p01_stark_verifier/tests`
# get it from that crate's dev-dependency on `p01-stark`, which enables the
# feature. `resolver = "2"` (workspace Cargo.toml) keeps dev-only features out
# of the normal graph, so `cargo build-sbf` is unaffected.
test-probes = ["deterministic-mask-for-tests"]

# [LEAK-LEDGER A8 2026-09-20] Compiles `BlindingMask::from_raw_for_tests` and
# its `u64` twin -- the ONLY way to put chosen bytes into a blinding mask.
#
# ⛔ NOT in `default`, and `wasm` must never pull it in. `cargo build`,
# `cargo build-sbf` and `wasm-pack build stark -- --features wasm` therefore do
# not compile it at all, so no shipped artefact can construct a mask that did
# not come from `BlindingMask::draw`. `stark/tests/mask_api.rs` asserts both of
# those manifest facts, and `tests/ui/*.rs` pins the rejections a caller gets.
#
# `test-probes` enables it because the `c*_deterministic_probe_mask` helpers it
# compiles ARE chosen masks, and because every cross-crate probe in
# `programs/p01_stark_verifier/tests` drives one. This crate's own integration
# tests get it through the dev-dependency on `test-support`.
deterministic-mask-for-tests = []

[dependencies]
# Winterfell STARK library (re-exports air, prover, verifier, math, crypto)
winterfell = { version = "0.10", default-features = false }

# SHA-256 for Merkle tree and Fiat-Shamir transcript.
# Chosen over Blake3 because the Solana `sol_blake3` syscall is gated behind a
# runtime feature that is inactive on devnet/mainnet, forcing the on-chain
# verifier onto the software Blake3 path (~15k CU per 64-byte hash). SHA-256
# has `sol_sha256` always active (~85 CU/call), which is what keeps the
# verifier under the 1.4M CU cap. `sha2` via hardware intrinsics on host
# matches the syscall output bit-for-bit.
sha2 = "0.10"

# Hex encoding for proof output
hex = "0.4"

# WASM bindings (optional)
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[[bin]]
name = "gen_proof"
path = "src/bin/gen_proof.rs"
required-features = ["std"]

[[bin]]
name = "probe_ood"
path = "src/bin/probe_ood.rs"
required-features = ["std"]

[dev-dependencies]
rand = "0.8"
hex = "0.4"

# [A8] Turns on `deterministic-mask-for-tests` while THIS crate's own
# integration tests build, without the crate dev-depending on itself.
# The reasons that matters are in stark/test-support/Cargo.toml.
p01-stark-test-support = { path = "test-support" }

# [A8] The compile-fail evidence: tests/ui/*.rs must not compile.
trybuild = "1"
