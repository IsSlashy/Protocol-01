# Cargo configuration for Solana/Anchor builds

[resolver]
# MSRV-aware resolver - fallback to older versions when newer ones
# require a Cargo/Rust version newer than the platform-tools bundled Cargo
incompatible-rust-versions = "fallback"

[net]
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true

[profile.release.build-override]
opt-level = 3
codegen-units = 1

[env]
RUSTFLAGS = "-C target-cpu=sbfv2"
